syntax = "proto3";

package auth;

option java_package = "com.kartseek.auth";
option java_outer_classname = "AuthProto";

// ─────────────────────────────────────────────────────────────────────────────
// KARTSEEK Auth Service — gRPC Definition
// Handles JWT validation, user lookup, refresh, and role checking.
// ─────────────────────────────────────────────────────────────────────────────

service AuthService {
  // Validate a JWT access token — called by API Gateway on every protected request
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse) {}

  // Get full user profile by ID
  rpc GetUser (GetUserRequest) returns (UserResponse) {}

  // Login and receive token pair
  rpc Login (LoginRequest) returns (AuthTokenResponse) {}

  // Register a new user account
  rpc Register (RegisterRequest) returns (AuthTokenResponse) {}

  // Refresh access token using refresh token
  rpc RefreshToken (RefreshTokenRequest) returns (AuthTokenResponse) {}

  // Invalidate tokens (logout)
  rpc Logout (LogoutRequest) returns (StatusResponse) {}

  // Check if a user has a specific role/permission
  rpc CheckPermission (CheckPermissionRequest) returns (CheckPermissionResponse) {}

  // Update a user's role (admin only)
  rpc UpdateRole (UpdateRoleRequest) returns (StatusResponse) {}

  // Ban a user account
  rpc BanUser (BanUserRequest) returns (StatusResponse) {}
}

// ── Request Messages ──────────────────────────────────────────────────────────

message ValidateTokenRequest {
  string token = 1;
}

message GetUserRequest {
  string userId = 1;
}

message LoginRequest {
  string email    = 1;
  string password = 2;
  string deviceId = 3;   // for session tracking
}

message RegisterRequest {
  string name     = 1;
  string email    = 2;
  string phone    = 3;
  string password = 4;
  string role     = 5;   // CUSTOMER | SELLER | DRIVER
  string country  = 6;
}

message RefreshTokenRequest {
  string refreshToken = 1;
}

message LogoutRequest {
  string userId       = 1;
  string refreshToken = 2;
}

message CheckPermissionRequest {
  string userId     = 1;
  string permission = 2;  // e.g. "orders:write" or role name
}

message UpdateRoleRequest {
  string userId  = 1;
  string newRole = 2;
  string adminId = 3;
}

message BanUserRequest {
  string userId  = 1;
  string reason  = 2;
  string adminId = 3;
}

// ── Response Messages ─────────────────────────────────────────────────────────

message ValidateTokenResponse {
  bool   isValid  = 1;
  string userId   = 2;
  string role     = 3;
  string email    = 4;
  int64  expiresAt = 5;
}

message UserResponse {
  string id          = 1;
  string email       = 2;
  string phone       = 3;
  string name        = 4;
  string role        = 5;
  string status      = 6;  // ACTIVE | BANNED | PENDING_KYC
  string country     = 7;
  string avatarUrl   = 8;
  string createdAt   = 9;
  bool   kycVerified = 10;
}

message AuthTokenResponse {
  string accessToken  = 1;
  string refreshToken = 2;
  int64  expiresIn    = 3;  // seconds
  UserResponse user   = 4;
}

message CheckPermissionResponse {
  bool   hasPermission = 1;
  string reason        = 2;
}

message StatusResponse {
  bool   success = 1;
  string message = 2;
}
