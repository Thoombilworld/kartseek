syntax = "proto3";

package grocery;

// ─────────────────────────────────────────────────────────────────────────────
// KARTSEEK Grocery Service — gRPC Definition
// Hyperlocal grocery delivery within a 10km GPS radius.
// ─────────────────────────────────────────────────────────────────────────────

service GroceryService {
  rpc GetNearbyStores     (NearbyStoresRequest)    returns (StoreListResponse)    {}
  rpc GetStoreById        (GetStoreRequest)        returns (StoreResponse)        {}
  rpc GetStoreProducts    (GetStoreProductsRequest) returns (ProductListResponse) {}
  rpc GetProductById      (GetProductRequest)      returns (ProductResponse)      {}
  rpc SearchProducts      (SearchRequest)          returns (ProductListResponse)  {}
  rpc GetCategories       (GetCategoriesRequest)   returns (CategoryListResponse) {}
  rpc PlaceOrder          (PlaceGroceryOrderRequest) returns (GroceryOrderResponse) {}
  rpc GetDeliverySlots    (GetDeliverySlotsRequest) returns (DeliverySlotListResponse) {}
}

// ── Requests ──────────────────────────────────────────────────────────────────

message NearbyStoresRequest {
  double lat      = 1;
  double lng      = 2;
  double radiusKm = 3;  // default 10km
  string category = 4;
  int32  page     = 5;
  int32  limit    = 6;
}

message GetStoreRequest {
  string storeId = 1;
}

message GetStoreProductsRequest {
  string storeId  = 1;
  string category = 2;
  string sortBy   = 3;  // price_asc | price_desc | popularity
  int32  page     = 4;
  int32  limit    = 5;
}

message GetProductRequest {
  string productId = 1;
}

message SearchRequest {
  string query   = 1;
  string storeId = 2;
  int32  page    = 3;
  int32  limit   = 4;
}

message GetCategoriesRequest {
  string storeId = 1;
}

message PlaceGroceryOrderRequest {
  string             customerId      = 1;
  string             storeId         = 2;
  repeated OrderItem items           = 3;
  string             deliveryAddress = 4;
  string             deliverySlotId  = 5;
  string             paymentMethod   = 6;
  string             notes           = 7;
}

message GetDeliverySlotsRequest {
  string storeId = 1;
  string date    = 2;  // YYYY-MM-DD
}

// ── Shared ────────────────────────────────────────────────────────────────────

message OrderItem {
  string productId = 1;
  string name      = 2;
  int32  quantity  = 3;
  double price     = 4;
  string unit      = 5;  // kg | piece | litre | pack
  double weight    = 6;  // for weight-based produce
}

message GeoPoint {
  double lat = 1;
  double lng = 2;
}

// ── Responses ─────────────────────────────────────────────────────────────────

message StoreResponse {
  string   id           = 1;
  string   name         = 2;
  string   slug         = 3;
  string   address      = 4;
  GeoPoint location     = 5;
  double   distKm       = 6;
  bool     isOpen       = 7;
  string   openHours    = 8;
  double   rating       = 9;
  int32    ratingCount  = 10;
  string   imageUrl     = 11;
  string   deliveryTime = 12;
  double   minOrder     = 13;
  double   deliveryFee  = 14;
}

message StoreListResponse {
  repeated StoreResponse data  = 1;
  int32                  total = 2;
  int32                  page  = 3;
  int32                  limit = 4;
}

message WeightVariant {
  string id     = 1;
  string label  = 2;  // "500g" | "1kg" | "2kg"
  double price  = 3;
  double weight = 4;
  int32  stock  = 5;
}

message ProductResponse {
  string                 id          = 1;
  string                 storeId     = 2;
  string                 name        = 3;
  string                 slug        = 4;
  string                 category    = 5;
  string                 description = 6;
  double                 price       = 7;
  double                 discountedPrice = 8;
  string                 unit        = 9;
  int32                  stock       = 10;
  string                 imageUrl    = 11;
  bool                   isAvailable = 12;
  repeated WeightVariant variants    = 13;
}

message ProductListResponse {
  repeated ProductResponse data  = 1;
  int32                    total = 2;
  int32                    page  = 3;
  int32                    limit = 4;
}

message CategoryResponse {
  string id        = 1;
  string name      = 2;
  string slug      = 3;
  string icon      = 4;
  string imageUrl  = 5;
  int32  itemCount = 6;
}

message CategoryListResponse {
  repeated CategoryResponse data = 1;
}

message DeliverySlot {
  string id        = 1;
  string label     = 2;  // "9 AM – 11 AM"
  string startTime = 3;
  string endTime   = 4;
  bool   available = 5;
  double fee       = 6;
}

message DeliverySlotListResponse {
  repeated DeliverySlot slots = 1;
  string                date  = 2;
}

message GroceryOrderResponse {
  string             id               = 1;
  string             customerId       = 2;
  string             storeId          = 3;
  repeated OrderItem items            = 4;
  double             subtotal         = 5;
  double             deliveryFee      = 6;
  double             totalAmount      = 7;
  string             deliverySlot     = 8;
  string             status           = 9;
  string             placedAt         = 10;
  string             estimatedDelivery = 11;
}

message StatusResponse {
  bool   success = 1;
  string message = 2;
}
