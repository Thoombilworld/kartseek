syntax = "proto3";

package order;

// ─────────────────────────────────────────────────────────────────────────────
// KARTSEEK Order Service — gRPC Definition
// ─────────────────────────────────────────────────────────────────────────────

service OrderService {
  rpc PlaceOrder          (PlaceOrderRequest)        returns (OrderResponse)   {}
  rpc GetOrderById        (GetOrderRequest)           returns (OrderResponse)   {}
  rpc GetOrderTracking    (GetOrderRequest)           returns (TrackingResponse){}
  rpc UpdateOrderStatus   (UpdateStatusRequest)       returns (StatusResponse)  {}
  rpc CancelOrder         (CancelOrderRequest)        returns (StatusResponse)  {}
  rpc GetCustomerOrders   (GetCustomerOrdersRequest)  returns (OrderListResponse){}
  rpc GetSellerOrders     (GetSellerOrdersRequest)    returns (OrderListResponse){}
}

// ── Shared ────────────────────────────────────────────────────────────────────

message OrderItem {
  string productId = 1;
  string name      = 2;
  int32  quantity  = 3;
  double price     = 4;
  string variantId = 5;
  string imageUrl  = 6;
}

message DriverInfo {
  string name    = 1;
  string phone   = 2;
  double lat     = 3;
  double lng     = 4;
  double heading = 5;
  double speed   = 6;
}

message TimelineEvent {
  string status = 1;
  string at     = 2;
  bool   done   = 3;
}

// ── Requests ──────────────────────────────────────────────────────────────────

message PlaceOrderRequest {
  string            customerId      = 1;
  repeated OrderItem items          = 2;
  string            deliveryAddress = 3;
  string            serviceType     = 4;
  string            paymentMethod   = 5;
  string            couponCode      = 6;
  double            walletAmount    = 7;
  string            notes           = 8;
}

message GetOrderRequest {
  string orderId = 1;
}

message UpdateStatusRequest {
  string orderId   = 1;
  string status    = 2;
  string updatedBy = 3;
}

message CancelOrderRequest {
  string orderId     = 1;
  string reason      = 2;
  string cancelledBy = 3;
}

message GetCustomerOrdersRequest {
  string customerId = 1;
  int32  page       = 2;
  int32  limit      = 3;
  string status     = 4;
}

message GetSellerOrdersRequest {
  string sellerId = 1;
  int32  page     = 2;
  int32  limit    = 3;
  string status   = 4;
}

// ── Responses ─────────────────────────────────────────────────────────────────

message OrderResponse {
  string             id                  = 1;
  string             customerId          = 2;
  repeated OrderItem items               = 3;
  double             subtotal            = 4;
  double             deliveryFee         = 5;
  double             discount            = 6;
  double             totalAmount         = 7;
  string             deliveryAddress     = 8;
  string             serviceType         = 9;
  string             paymentMethod       = 10;
  string             status              = 11;
  string             notes               = 12;
  string             placedAt            = 13;
  string             estimatedDeliveryAt = 14;
  string             updatedAt           = 15;
}

message TrackingResponse {
  string                 orderId             = 1;
  string                 status              = 2;
  string                 estimatedDeliveryAt = 3;
  DriverInfo             driver              = 4;
  repeated TimelineEvent timeline            = 5;
}

message OrderListResponse {
  repeated OrderResponse data  = 1;
  int32                  total = 2;
  int32                  page  = 3;
  int32                  limit = 4;
}

message StatusResponse {
  bool   success = 1;
  string message = 2;
}
