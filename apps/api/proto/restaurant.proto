syntax = "proto3";

package restaurant;

// ─────────────────────────────────────────────────────────────────────────────
// KARTSEEK Restaurant Service — gRPC Definition
// ─────────────────────────────────────────────────────────────────────────────

service RestaurantService {
  rpc GetNearbyRestaurants (NearbyRequest)          returns (RestaurantListResponse) {}
  rpc GetRestaurantById    (GetRestaurantRequest)   returns (RestaurantResponse)     {}
  rpc GetRestaurantMenu    (GetMenuRequest)         returns (MenuResponse)           {}
  rpc AddMenuItem          (AddMenuItemRequest)     returns (MenuItemResponse)       {}
  rpc UpdateMenuItem       (UpdateMenuItemRequest)  returns (MenuItemResponse)       {}
  rpc DeleteMenuItem       (DeleteMenuItemRequest)  returns (StatusResponse)         {}
  rpc BookTable            (BookTableRequest)       returns (BookingResponse)        {}
  rpc GetBookings          (GetBookingsRequest)     returns (BookingListResponse)    {}
  rpc ToggleStatus         (ToggleStatusRequest)    returns (StatusResponse)         {}
  rpc ApproveRestaurant    (ApproveRequest)         returns (StatusResponse)         {}
  rpc GetPendingApprovals  (EmptyRequest)           returns (RestaurantListResponse) {}
}

// ── Shared ────────────────────────────────────────────────────────────────────

message EmptyRequest {}

message GeoPoint {
  double lat = 1;
  double lng = 2;
}

// ── Requests ──────────────────────────────────────────────────────────────────

message NearbyRequest {
  double lat      = 1;
  double lng      = 2;
  double radiusKm = 3;
  string cuisine  = 4;
  int32  page     = 5;
  int32  limit    = 6;
}

message GetRestaurantRequest {
  string restaurantId = 1;  // ID or slug
}

message GetMenuRequest {
  string restaurantId = 1;
}

message AddMenuItemRequest {
  string restaurantId = 1;
  string name         = 2;
  double price        = 3;
  string description  = 4;
  bool   isVeg        = 5;
  string imageUrl     = 6;
  string category     = 7;
  repeated string tags = 8;
}

message UpdateMenuItemRequest {
  string itemId       = 1;
  string name         = 2;
  double price        = 3;
  string description  = 4;
  bool   isVeg        = 5;
  bool   isAvailable  = 6;
  string imageUrl     = 7;
}

message DeleteMenuItemRequest {
  string itemId       = 1;
  string restaurantId = 2;
}

message BookTableRequest {
  string restaurantId = 1;
  string userId       = 2;
  string date         = 3;
  string time         = 4;
  int32  guests       = 5;
  string notes        = 6;
}

message GetBookingsRequest {
  string restaurantId = 1;
  string date         = 2;
}

message ToggleStatusRequest {
  string restaurantId = 1;
  bool   isOnline     = 2;
}

message ApproveRequest {
  string restaurantId = 1;
  string adminId      = 2;
}

// ── Responses ─────────────────────────────────────────────────────────────────

message RestaurantResponse {
  string   id           = 1;
  string   name         = 2;
  string   slug         = 3;
  string   cuisine      = 4;
  bool     isOpen       = 5;
  double   rating       = 6;
  int32    ratingCount  = 7;
  string   deliveryTime = 8;
  double   minOrder     = 9;
  GeoPoint location     = 10;
  string   address      = 11;
  string   imageUrl     = 12;
  double   distKm       = 13;
  string   status       = 14;
  string   openHours    = 15;
}

message RestaurantListResponse {
  repeated RestaurantResponse data  = 1;
  int32                       total = 2;
  int32                       page  = 3;
  int32                       limit = 4;
}

message MenuItemResponse {
  string id           = 1;
  string restaurantId = 2;
  string name         = 3;
  double price        = 4;
  string description  = 5;
  bool   isVeg        = 6;
  bool   isAvailable  = 7;
  bool   isBestseller = 8;
  string category     = 9;
  string imageUrl     = 10;
  double rating       = 11;
  string status       = 12;
}

message MenuCategory {
  string                  name  = 1;
  repeated MenuItemResponse items = 2;
}

message MenuResponse {
  string                restaurantId = 1;
  repeated MenuCategory categories   = 2;
}

message BookingResponse {
  string id           = 1;
  string restaurantId = 2;
  string userId       = 3;
  string date         = 4;
  string time         = 5;
  int32  guests       = 6;
  string status       = 7;
  string createdAt    = 8;
}

message BookingListResponse {
  repeated BookingResponse data  = 1;
  int32                    total = 2;
}

message StatusResponse {
  bool   success = 1;
  string message = 2;
}
