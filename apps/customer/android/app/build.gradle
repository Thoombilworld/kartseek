// KARTSEEK Customer App — Module-level build.gradle (android/app)
// KGP 2.4.0 required — google_maps_flutter_android depends on kotlin-stdlib 2.3.10
// Migrate to built-in Kotlin when upgrading to AGP 9.x+
plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0.0"
}

// ── Release Signing ──────────────────────────────────────────────────────────
// Loads credentials from key.properties (gitignored).
// Copy key.properties.example → key.properties and fill in your keystore details.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.kartseek.app"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    // Fix: package_info_plus v10+ is Kotlin-only, but Flutter auto-generates
    // GeneratedPluginRegistrant.java which references its Kotlin class.
    // Solution: Route ALL sources through the Kotlin compiler (which natively
    // handles .java files) and empty the Java source set to prevent javac from
    // running separately. This ensures all symbols resolve in a single pass.
    sourceSets {
        main {
            kotlin.srcDirs += 'src/main/java'
            java.srcDirs = []   // Prevent javac from running on these files
        }
    }


    defaultConfig {
        applicationId = "com.kartseek.customer"
        minSdk = 24           // Android 7.0 — reasonable baseline for 2026
        targetSdk = 35        // Android 15 — current Play Store requirement
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled = true

        ndk {
            // Only ship ARM + x86_64 (for emulators); drop x86 for smaller APK
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' // cSpell:ignore armeabi
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        profile {
            initWith debug
            applicationIdSuffix ".profile"
        }
        release {
            signingConfig keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        buildConfig = true
    }

    lint {
        disable "InvalidPackage"
        checkReleaseBuilds false
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}

// Force AndroidX Core versions compatible with compileSdk 36 / AGP 8.11.1 / Kotlin 2.4.0
// core:1.17.0 requires compileSdk 36 + AGP 8.9.1+ (both satisfied)
// core:1.18.0 needs compileSdk "36.1", core:1.19.0 needs compileSdk 37 + AGP 9.1.0
configurations.all {
    resolutionStrategy {
        force "androidx.core:core-ktx:1.17.0"
        force "androidx.core:core:1.17.0"
    }
}
