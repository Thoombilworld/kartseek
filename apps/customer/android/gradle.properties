# KARTSEEK Customer App — Gradle Properties
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# Prevent R8 full mode from aggressively stripping Flutter plugin classes
android.enableR8.fullMode=false
# AGP 8.11.1 built-in Kotlin is 2.0.0 — too old for plugins needing kotlin-stdlib 2.3.10+
# Keep false until upgrading to AGP 9.x+ which ships Kotlin 2.2.20+
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
