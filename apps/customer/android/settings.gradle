// KARTSEEK Customer App — settings.gradle
// KGP 2.4.0 required — google_maps_flutter_android needs kotlin-stdlib 2.3.10
// Migrate to built-in Kotlin when upgrading to AGP 9.x+ (which ships Kotlin ≥2.2.20)
pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.4.0" apply false
}

rootProject.name = "kartseek-customer-android"

include ":app"
