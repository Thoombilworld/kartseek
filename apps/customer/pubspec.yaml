name: kartseek_customer
description: "KARTSEEK Customer App — Marketplace, Grocery, Restaurant, Doctor, Pharmacy & Taxi booking."
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Required by MaterialApp.localizationsDelegates — without it Material and
  # Cupertino widgets only carry English strings, so every non-`en` entry in
  # LocaleProvider.supportedLocales renders untranslated system UI.
  flutter_localizations:
    sdk: flutter

  # ── Shared infrastructure ──────────────────────────────────────────────
  shared_mobile:
    path: ../../packages/shared-mobile

  # ── Packages used directly in customer Dart code ────────────────────────
  flutter_bloc: ^9.1.0
  bloc_concurrency: ^0.3.0
  provider: ^6.1.2
  equatable: ^2.0.7
  dio: ^5.7.0
  intl: ^0.20.2
  google_maps_flutter: ^2.10.0
  geolocator: any
  http: ^1.2.0

  # ── Customer-specific dependencies ─────────────────────────────────────
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  file_picker: ^12.0.0-beta.7
  camera: ^0.12.0+1
  path_provider: ^2.1.5
  lottie: ^3.2.0
  local_auth: ^3.0.1
  permission_handler: ^12.0.3
  speech_to_text: ^7.0.0
  mobile_scanner: ^6.0.0
  google_mlkit_text_recognition: ^0.14.0

  # ── New: Notifications & Connectivity ──────────────────────────────────
  flutter_local_notifications: ^22.0.1
  connectivity_plus: ^7.1.1
  package_info_plus: any
  shared_preferences: ^2.5.5
  flutter_polyline_points: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

dependency_overrides:
  objective_c:
    path: ../../packages/native-bindings
  flutter_plugin_android_lifecycle: 2.0.35
