// KARTSEEK Partner App — Module-level build.gradle (android/app)
// KGP 2.4.0 applied explicitly — required for kotlin-stdlib 2.3.10 compatibility
plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0.0"
}

android {
    namespace = "com.kartseek.partner"
    compileSdk = 36               // Android 16 — latest stable
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.kartseek.partner"
        minSdk = 24           // Android 7.0 — reasonable baseline for 2026
        targetSdk = 35        // Android 15 — current Play Store requirement
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled = true

        ndk {
            // Only ship ARM + x86_64 (for emulators); drop x86 for smaller APK
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            // For production builds, configure these from environment variables
            // or a keystore.properties file (never commit credentials)
            // storeFile file("kartseek-release.keystore")
            // storePassword System.getenv("KEYSTORE_PASSWORD")
            // keyAlias System.getenv("KEY_ALIAS")
            // keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        profile {
            initWith debug
            applicationIdSuffix ".profile"
        }
        release {
            // signingConfig signingConfigs.release  // Uncomment for production
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        buildConfig = true
    }

    lint {
        disable "InvalidPackage"
        checkReleaseBuilds false
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}

// Force AndroidX Core versions compatible with compileSdk 36 / AGP 8.11.1 / Kotlin 2.4.0
// core:1.17.0 requires compileSdk 36 + AGP 8.9.1+ (both satisfied)
// core:1.18.0 needs compileSdk "36.1", core:1.19.0 needs compileSdk 37 + AGP 9.1.0
configurations.all {
    resolutionStrategy {
        force "androidx.core:core-ktx:1.17.0"
        force "androidx.core:core:1.17.0"
    }
}
