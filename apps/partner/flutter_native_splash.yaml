# KARTSEEK Partner App — Native Splash Screen Configuration
# Run: dart run flutter_native_splash:create
# Docs: https://pub.dev/packages/flutter_native_splash

flutter_native_splash:
  # Splash screen background color (KARTSEEK white)
  color: "#FFFFFF"

  # App icon displayed in center of splash
  image: "assets/icons/splash_logo.png"
  image_dark: "assets/icons/splash_logo.png"

  # Android 12+ splash screen
  android_12:
    color: "#FFFFFF"
    icon_background_color: "#4F46E5"    # KARTSEEK Partner indigo
    image: "assets/icons/splash_logo.png"

  # iOS splash
  ios: true

  # Web splash (disabled)
  web: false

  # Full screen mode
  fullscreen: true
