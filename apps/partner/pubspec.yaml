name: kartseek_partner
description: "KARTSEEK Partner App — Unified Taxi Driver & Delivery Partner application."
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Required by MaterialApp.localizationsDelegates — see customer/pubspec.yaml.
  flutter_localizations:
    sdk: flutter

  # ── Shared infrastructure ──────────────────────────────────────────────
  kartseek_shared_mobile:
    path: ../../packages/shared-mobile

  # ── Packages used directly in partner Dart code ─────────────────────────
  flutter_bloc: ^9.1.0
  provider: ^6.1.2
  equatable: ^2.0.7

  # ── Partner-specific dependencies ──────────────────────────────────────
  cupertino_icons: ^1.0.8
  lottie: ^3.2.0
  permission_handler: ^12.0.3
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  geolocator: ^13.0.1
  google_maps_flutter: ^2.10.0

  # ── Infrastructure (added for production readiness) ────────────────────
  flutter_local_notifications: ^22.0.1   # Local push for ride/delivery requests
  connectivity_plus: ^7.1.1             # Offline detection (critical for drivers)
  package_info_plus: ^10.1.0             # Version display in settings

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

# ─── Dependency Overrides ───────────────────────────────────────────────
dependency_overrides:
  objective_c:
    path: ../../packages/vendor/objective_c
  flutter_plugin_android_lifecycle: 2.0.35
