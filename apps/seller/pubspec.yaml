name: kartseek_seller
description: "KARTSEEK Seller App — Unified seller portal for all 7 business modules: Marketplace, Grocery, Restaurant, Pharmacy, Doctor, Hotel, and Taxi Vendor."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Required by MaterialApp.localizationsDelegates — see customer/pubspec.yaml.
  flutter_localizations:
    sdk: flutter

  # ── Shared infrastructure (same pattern as customer + partner apps) ────────
  shared_mobile:
    path: ../../packages/shared-mobile

  # ── State management ──────────────────────────────────────────────────────
  flutter_bloc: ^9.1.0
  provider: ^6.1.2
  equatable: ^2.0.7

  # ── Networking & real-time ─────────────────────────────────────────────────
  dio: ^5.7.0
  socket_io_client: ^3.1.6

  # ── UI / UX ───────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  lottie: ^3.2.0
  fl_chart: ^1.2.0
  table_calendar: ^3.2.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  photo_view: ^0.15.0

  # ── Doctor: WebRTC video calling ──────────────────────────────────────────
  # flutter_webrtc: pulled via dart_webrtc -> objective_c (iOS FFI) which
  # triggers a build.dart hook that fails on Windows paths with spaces.
  # Using pure-Dart signalling stub until package is fixed upstream.
  # See: https://github.com/flutter-webrtc/flutter-webrtc/issues/XXXX

  # ── Utilities ─────────────────────────────────────────────────────────────
  intl: ^0.20.2
  url_launcher: ^6.3.1
  permission_handler: ^12.0.3
  connectivity_plus: ^7.1.1
  package_info_plus: ^10.1.0
  flutter_local_notifications: ^22.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

# ─── Dependency Overrides (align with monorepo) ───────────────────────────
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.35
  # path_provider_foundation 2.6.0 uses objective_c (FFI) which runs a
  # build.dart hook — breaks on Windows paths with spaces in the username.
  # 2.5.1 reverts to plugin-based impl with no objective_c dependency.
  path_provider_foundation: 2.5.1
