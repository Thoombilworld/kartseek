# ─────────────────────────────────────────────────────────────────────────────
# KARTSEEK — Local Infrastructure Stack
# 
# ⚠️  SECURITY: Use environment variables for all credentials
# Create a .env file in the root (not in version control) with:
#   POSTGRES_PASSWORD=<strong-password>
#   MARKETPLACE_DB_PASSWORD=<strong-password>
#   REDIS_PASSWORD=<strong-password>
#   MONGO_ROOT_PASSWORD=<strong-password>
#   PGADMIN_PASSWORD=<strong-password>
#
# Usage:
#   npm run infra:up     → start all services in background
#   npm run infra:down   → stop and remove containers
#   npm run infra:logs   → follow all container logs
#
# After starting: PostgreSQL on 5432, Redis on 6379, Kafka on 9092
#
# Database-per-service:
#   docker compose --profile isolated up -d
# gives each module its own Postgres instance rather than a database inside the
# shared one. Ports 5433-5440, one container each:
#   5433 marketplace   5434 grocery     5435 restaurant   5436 pharmacy
#   5437 doctor        5438 hotel       5439 taxi         5440 franchise
#
# That is nine Postgres containers including the platform one, so expect around
# 1-2 GB of memory for the databases alone. The default `up` leaves them off and
# every module falls back to the shared instance, which is the lighter way to
# work on one module at a time.
#
# Move existing data into them with:
#   npm run db:split -w kartseek-api            (dry run)
#   npm run db:split -w kartseek-api -- --apply
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: kartseek-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_development}
      POSTGRES_DB: ${POSTGRES_DB:-kartseek_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL (Marketplace — dedicated instance) ──────────────────────────
  # Activate with: docker compose --profile marketplace-isolated up -d
  # Then set MARKETPLACE_DB_HOST=localhost MARKETPLACE_DB_PORT=5433 in .env
  postgres-marketplace:
    image: postgis/postgis:16-3.4-alpine
    container_name: kartseek-postgres-marketplace
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MARKETPLACE_DB_USER:-marketplace_user}
      POSTGRES_PASSWORD: ${MARKETPLACE_DB_PASSWORD:-change_me_in_development}
      POSTGRES_DB: ${MARKETPLACE_DB_NAME:-kartseek_marketplace}
    ports:
      - '5433:5432'
    volumes:
      - postgres_marketplace_data:/var/lib/postgresql/data
      - ./infra/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${MARKETPLACE_DB_USER:-marketplace_user}']
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      # `isolated` brings up every module database at once; the original
      # profile name still works on its own.
      - isolated
      - marketplace-isolated

  # ── PostgreSQL (Grocery — dedicated instance) ──────────────────────────────
  # docker compose --profile isolated up -d
  # Then in apps/api/.env:  GROCERY_DB_HOST=localhost  GROCERY_DB_PORT=5434
  postgres-grocery:
    image: postgis/postgis:16-3.4-alpine
    container_name: kartseek-postgres-grocery
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${GROCERY_DB_USER:-grocery_user}
      POSTGRES_PASSWORD: ${GROCERY_DB_PASSWORD:-change_me_in_development}
      POSTGRES_DB: ${GROCERY_DB_NAME:-kartseek_grocery}
    ports:
      - '5434:5432'
    volumes:
      - postgres_grocery_data:/var/lib/postgresql/data
      - ./infra/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${GROCERY_DB_USER:-grocery_user}']
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - isolated

  # ── PostgreSQL (Restaurant — dedicated instance) ──────────────────────────────
  # docker compose --profile isolated up -d
  # Then in apps/api/.env:  RESTAURANT_DB_HOST=localhost  RESTAURANT_DB_PORT=5435
  postgres-restaurant:
    image: postgis/postgis:16-3.4-alpine
    container_name: kartseek-postgres-restaurant
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${RESTAURANT_DB_USER:-restaurant_user}
      POSTGRES_PASSWORD: ${RESTAURANT_DB_PASSWORD:-change_me_in_development}
      POSTGRES_DB: ${RESTAURANT_DB_NAME:-kartseek_restaurant}
    ports:
      - '5435:5432'
    volumes:
      - postgres_restaurant_data:/var/lib/postgresql/data
      - ./infra/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${RESTAURANT_DB_USER:-restaurant_user}']
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - isolated

  # ── PostgreSQL (Pharmacy — dedicated instance) ──────────────────────────────
  # docker compose --profile isolated up -d
  # Then in apps/api/.env:  PHARMACY_DB_HOST=localhost  PHARMACY_DB_PORT=5436
  postgres-pharmacy:
    image: postgis/postgis:16-3.4-alpine
    container_name: kartseek-postgres-pharmacy
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PHARMACY_DB_USER:-pharmacy_user}
      POSTGRES_PASSWORD: ${PHARMACY_DB_PASSWORD:-change_me_in_development}
      POSTGRES_DB: ${PHARMACY_DB_NAME:-kartseek_pharmacy}
    ports:
      - '5436:5432'
    volumes:
      - postgres_pharmacy_data:/var/lib/postgresql/data
      - ./infra/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PHARMACY_DB_USER:-pharmacy_user}']
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - isolated

  # ── PostgreSQL (Doctor — dedicated instance) ──────────────────────────────
  # docker compose --profile isolated up -d
  # Then in apps/api/.env:  DOCTOR_DB_HOST=localhost  DOCTOR_DB_PORT=5437
  postgres-doctor:
    image: postgis/postgis:16-3.4-alpine
    container_name: kartseek-postgres-doctor
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DOCTOR_DB_USER:-doctor_user}
      POSTGRES_PASSWORD: ${DOCTOR_DB_PASSWORD:-change_me_in_development}
      POSTGRES_DB: ${DOCTOR_DB_NAME:-kartseek_doctor}
    ports:
      - '5437:5432'
    volumes:
      - postgres_doctor_data:/var/lib/postgresql/data
      - ./infra/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DOCTOR_DB_USER:-doctor_user}']
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - isolated

  # ── PostgreSQL (Hotel — dedicated instance) ──────────────────────────────
  # docker compose --profile isolated up -d
  # Then in apps/api/.env:  HOTEL_DB_HOST=localhost  HOTEL_DB_PORT=5438
  postgres-hotel:
    image: postgis/postgis:16-3.4-alpine
    container_name: kartseek-postgres-hotel
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HOTEL_DB_USER:-hotel_user}
      POSTGRES_PASSWORD: ${HOTEL_DB_PASSWORD:-change_me_in_development}
      POSTGRES_DB: ${HOTEL_DB_NAME:-kartseek_hotel}
    ports:
      - '5438:5432'
    volumes:
      - postgres_hotel_data:/var/lib/postgresql/data
      - ./infra/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${HOTEL_DB_USER:-hotel_user}']
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - isolated

  # ── PostgreSQL (Taxi — dedicated instance) ──────────────────────────────
  # docker compose --profile isolated up -d
  # Then in apps/api/.env:  TAXI_DB_HOST=localhost  TAXI_DB_PORT=5439
  postgres-taxi:
    image: postgis/postgis:16-3.4-alpine
    container_name: kartseek-postgres-taxi
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TAXI_DB_USER:-taxi_user}
      POSTGRES_PASSWORD: ${TAXI_DB_PASSWORD:-change_me_in_development}
      POSTGRES_DB: ${TAXI_DB_NAME:-kartseek_taxi}
    ports:
      - '5439:5432'
    volumes:
      - postgres_taxi_data:/var/lib/postgresql/data
      - ./infra/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${TAXI_DB_USER:-taxi_user}']
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - isolated

  # ── PostgreSQL (Franchise — dedicated instance) ──────────────────────────────
  # docker compose --profile isolated up -d
  # Then in apps/api/.env:  FRANCHISE_DB_HOST=localhost  FRANCHISE_DB_PORT=5440
  postgres-franchise:
    image: postgis/postgis:16-3.4-alpine
    container_name: kartseek-postgres-franchise
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${FRANCHISE_DB_USER:-franchise_user}
      POSTGRES_PASSWORD: ${FRANCHISE_DB_PASSWORD:-change_me_in_development}
      POSTGRES_DB: ${FRANCHISE_DB_NAME:-kartseek_franchise}
    ports:
      - '5440:5432'
    volumes:
      - postgres_franchise_data:/var/lib/postgresql/data
      - ./infra/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${FRANCHISE_DB_USER:-franchise_user}']
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - isolated

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:8.8.0-alpine
    container_name: kartseek-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD:-change_me_in_development} --maxmemory 256mb --maxmemory-policy allkeys-lru --rename-command FLUSHDB "" --rename-command FLUSHALL "" --rename-command DEBUG ""
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-change_me_in_development}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Kafka (KRaft Mode) ─────────────────────────────────────────────────────
  kafka:
    image: apache/kafka:4.3.0
    container_name: kartseek-kafka
    restart: unless-stopped
    ports:
      - '9092:9092'
      - '9101:9101'
    environment:
      # KRaft settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Cluster settings
      CLUSTER_ID: c1c6d328-9104-4b47-ba03-3fa80eeb7254
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Must be a mounted volume, not /tmp. Kafka keeps every topic,
      # message and consumer offset here; with this on the container's
      # writable layer, recreating the container wiped the whole cluster
      # and — with auto-creation disabled below — every consumer then
      # crash-looped on 'does not host this topic-partition'.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD', '/opt/kafka/bin/kafka-topics.sh', '--bootstrap-server', 'localhost:9092', '--list']
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Kafka UI (browse topics, messages, consumer groups) ───────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kartseek-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - '8080:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:8.3
    container_name: kartseek-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change_me_in_development}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-kartseek_catalog}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin (PostgreSQL GUI) ───────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kartseek-pgadmin
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - '5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@kartseek.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-change_me_in_development}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    profiles:
      - tools

  # ── Redis Insight (Redis GUI) ──────────────────────────────────────────────
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: kartseek-redis-insight
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - '5540:5540'
    profiles:
      - tools

  # ── Elasticsearch (Full-Text Search) ──────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: kartseek-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=kartseek-search
      - node.name=kartseek-es-01
    ports:
      - '9200:9200'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsSL http://localhost:9200/_cluster/health | grep -qE "green|yellow"']
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  # ── Kibana (Elasticsearch GUI) ──────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: kartseek-kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - '5601:5601'
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    profiles:
      - tools

  # ── NGINX Reverse Proxy (HTTP/2) ────────────────────────────────────────────
  nginx:
    image: nginx:1.30.3-alpine
    container_name: kartseek-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/nginx-health']
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  postgres_marketplace_data:
  postgres_grocery_data:
  postgres_restaurant_data:
  postgres_pharmacy_data:
  postgres_doctor_data:
  postgres_hotel_data:
  postgres_taxi_data:
  postgres_franchise_data:
  kafka_data:
  redis_data:
  mongo_data:
  pgadmin_data:
  elasticsearch_data:

networks:
  default:
    name: kartseek-network
