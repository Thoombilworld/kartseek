  # ── PostgreSQL (Franchise — dedicated instance) ──────────────────────────────
  # docker compose --profile isolated up -d
  # Then in apps/api/.env:  FRANCHISE_DB_HOST=localhost  FRANCHISE_DB_PORT=5440
  postgres-franchise:
    image: postgis/postgis:16-3.4-alpine
    container_name: kartseek-postgres-franchise
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${FRANCHISE_DB_USER:-franchise_user}
      POSTGRES_PASSWORD: ${FRANCHISE_DB_PASSWORD:?set FRANCHISE_DB_PASSWORD in the root .env}
      POSTGRES_DB: ${FRANCHISE_DB_NAME:-kartseek_franchise}
    ports:
      - '${DB_BIND:-127.0.0.1}:5440:5432'
    volumes:
      - postgres_franchise_data:/var/lib/postgresql/data
      - ../postgres/init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${FRANCHISE_DB_USER:-franchise_user}']
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - isolated

  # ── Redis ──────────────────────────────────────────────────────────────────
  #
  # `--maxmemory-policy volatile-lru`, NOT `allkeys-lru`. This store is not a
  # pure cache: several keys are written with no expiry at all and are the only
  # copy of what they hold —
  #
  #   loyalty:<userId>                    loyalty.service.ts:50 — a points balance,
  #                                       the headline key of AUD2-031
  #   admin:counter:pending_kyc           admin-service, the KYC queue depth
  #   notifications:unread:<userId>       reset to 0 by notifications.gateway.ts
  #   ride:waiting:<rideId>               taxi driver-dispatch, a ride IN FLIGHT
  #
  # Under `allkeys-lru` Redis evicts by recency across EVERY key once it reaches
  # `--maxmemory`, so the least recently touched of those four disappears with
  # no error anywhere: a ride in dispatch simply stops existing. `volatile-lru`
  # restricts eviction to keys that carry a TTL — sessions, MFA challenges, rate
  # limit buckets, the home cache — which are all re-derivable. If the store
  # ever fills with nothing but non-expiring keys the write fails loudly with
  # OOM, which is the right way round: an error a developer sees beats state
  # that vanishes, and `RedisService.assertEmulatorAllowed` turns that OOM into
  # a 503 under NODE_ENV=production rather than into invented data.
  #
  # `--appendonly yes --appendfsync everysec` is the other half of AUD2-031, and
  # it is what makes the policy change worth anything. `--save 60 1` alone is an
  # RDB snapshot every 60 seconds at best, so an unclean stop loses up to a
  # minute of exactly the keys the eviction policy was changed to protect. The
  # AOF is written to the same `redis_data` volume as the RDB and is replayed
  # ahead of it on start. `everysec` rather than `always`: one second of
  # exposure for roughly the throughput, which is the standard trade and the
  # right one for a store that is mostly cache.
  #
  # Both halves are asserted live by `npm run stack:validate` (CONFIG GET
  # maxmemory-policy, CONFIG GET appendonly), so a future edit to this line
  # cannot silently undo either. Found by that validator (Task IN7).
  redis:
    image: redis:8.8.0-alpine
    container_name: kartseek-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly yes --appendfsync everysec --loglevel warning --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in the root .env} --maxmemory 256mb --maxmemory-policy volatile-lru --rename-command FLUSHDB "" --rename-command FLUSHALL "" --rename-command DEBUG ""
    ports:
      - '${DB_BIND:-127.0.0.1}:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:?set REDIS_PASSWORD in the root .env}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Kafka (KRaft Mode) ─────────────────────────────────────────────────────
  kafka:
    image: apache/kafka:4.3.0
    container_name: kartseek-kafka
    restart: unless-stopped
    ports:
      - '${DB_BIND:-127.0.0.1}:9092:9092'
      - '${DB_BIND:-127.0.0.1}:9101:9101'
    environment:
      # KRaft settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      # TWO listeners, and which one a client uses is not a preference.
      # PLAINTEXT advertises itself as `kafka:29092` and is the one for anything
      # ON the network — every container in compose.services.yml, and kafka-ui
      # below. PLAINTEXT_HOST advertises `localhost:9092` and is for the
      # developer's own fleet running on the host. A container that bootstraps
      # against 9092 is answered with metadata naming `localhost:9092` and then
      # dials its own loopback: it looks like a broker outage and is not.
      # Do not "simplify" these to one listener.
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Cluster settings
      CLUSTER_ID: c1c6d328-9104-4b47-ba03-3fa80eeb7254
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Must be a mounted volume, not /tmp. Kafka keeps every topic,
      # message and consumer offset here; with this on the container's
      # writable layer, recreating the container wiped the whole cluster
      # and — with auto-creation disabled below — every consumer then
      # crash-looped on 'does not host this topic-partition'.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        ['CMD', '/opt/kafka/bin/kafka-topics.sh', '--bootstrap-server', 'localhost:9092', '--list']
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Kafka UI (browse topics, messages, consumer groups) ───────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kartseek-kafka-ui
    restart: unless-stopped
    # `service_healthy`, not the bare name, to match kibana below. Without it
    # Compose starts this the moment the Kafka *container* exists, which is
    # roughly thirty seconds before the broker accepts a connection: the UI
    # comes up showing an offline cluster and stays that way until someone
    # reloads it, so the stack looks broken when it is merely early.
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '${DB_BIND:-127.0.0.1}:8080:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:8.3
    container_name: kartseek-mongo
    restart: unless-stopped
    ports:
      - '${DB_BIND:-127.0.0.1}:27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in the root .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-kartseek_catalog}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin (PostgreSQL GUI) ───────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kartseek-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${DB_BIND:-127.0.0.1}:5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@kartseek.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in the root .env}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    profiles:
      - tools

  # ── Redis Insight (Redis GUI) ──────────────────────────────────────────────
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: kartseek-redis-insight
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - '${DB_BIND:-127.0.0.1}:5540:5540'
    profiles:
      - tools

  # ── Elasticsearch (Full-Text Search) ──────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: kartseek-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      # Authentication ON. It was off, which meant anyone who could reach 9200
      # could read, rewrite or DELETE every index — and the search index is a
      # denormalised copy of the catalogue, so that is a read of the whole
      # product corpus and a way to poison every search result the storefront
      # renders (AUD2-075). Loopback binding above is not a substitute: it does
      # nothing against anything already running on the machine.
      - xpack.security.enabled=true
      # Enrollment tokens are for joining nodes and auto-configuring Kibana in a
      # TLS cluster; this is a single node on a private network, so off.
      - xpack.security.enrollment.enabled=false
      # Bootstraps the built-in `elastic` superuser, once, when the security
      # index is first created. Changing it later does NOT rotate the password —
      # use the _security/user API, or recreate the volume.
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in the root .env}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=kartseek-search
      - node.name=kartseek-es-01
    ports:
      - '${DB_BIND:-127.0.0.1}:9200:9200'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      # Credentials on the check too: without them this now gets 401 and the
      # container would be `unhealthy` for ever, which is the failure mode
      # AUD2-020 is about on the other side of the stack.
      #
      # The `-u` argument is QUOTED. Compose interpolates the password into this
      # string and `/bin/sh -c` then parses the result, so an unquoted value
      # containing a space, `;`, a backtick or `$` would either break the check
      # (unhealthy for ever) or run as a command inside the container, as root.
      # `npm run env:init` generates hex, which needs no quoting — the quotes are
      # for the password someone sets by hand.
      test:
        [
          'CMD-SHELL',
          'curl -fsSL -u "elastic:${ELASTIC_PASSWORD}" http://localhost:9200/_cluster/health | grep -qE "green|yellow"',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  # ── Kibana (Elasticsearch GUI) ──────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: kartseek-kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - '${DB_BIND:-127.0.0.1}:5601:5601'
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      # Elasticsearch now requires authentication, so Kibana needs an account.
      # It cannot be `elastic`: Kibana refuses that name at config validation
      # ("a superuser account that cannot write to system indices that Kibana
      # needs to function") and will not start. `kibana_system` is the built-in
      # role for this, and unlike `elastic` it has no bootstrap environment
      # variable — its password is set once, through the API, after the cluster
      # is up:
      #
      #   docker compose exec elasticsearch \
      #     curl -sS -u elastic:"$ELASTIC_PASSWORD" -X POST \
      #     -H 'Content-Type: application/json' \
      #     http://localhost:9200/_security/user/kibana_system/_password \
      #     -d "{\"password\":\"$KIBANA_SYSTEM_PASSWORD\"}"
      #
      # Until that runs, Kibana logs 401s against a healthy cluster. Kibana is
      # in the `tools` profile and nothing on the platform depends on it.
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?set KIBANA_SYSTEM_PASSWORD in the root .env}
    profiles:
      - tools

  # ── NGINX Reverse Proxy (HTTP/2) ────────────────────────────────────────────
  nginx:
    image: nginx:1.30.3-alpine
    container_name: kartseek-nginx
    restart: unless-stopped
    # Bound to loopback by default: this edge fronts a development gateway whose
    # DEV_AUTH_BYPASS treats anonymous callers as SUPER_ADMIN, so it must not be
    # reachable from the LAN by accident. Testing from a phone on the same
    # network is an explicit choice: set NGINX_BIND=0.0.0.0 in the root .env.
    ports:
      - '${NGINX_BIND:-127.0.0.1}:80:80'
      - '${NGINX_BIND:-127.0.0.1}:443:443'
    # Which main config is mounted, and it is the ONE switch between the two
    # worlds this edge can front (infra/docker/README.md, "Which nginx config
    # is mounted"):
    #
    #   unset / nginx.conf          the host-process fleet — `npm run dev` —
    #                               through host.docker.internal. The default,
    #                               so nothing about `npm run dev` changes.
    #   NGINX_CONF=nginx.compose.conf   the containerised app tier, by compose
    #                               service name: api-gateway:3001, web:3000 and
    #                               each zone. Set it in the root .env (Compose
    #                               reads no other) alongside `--profile admin`
    #                               or `--profile full`.
    #
    # The nginx service itself carries no profile — it is infrastructure and
    # comes up with `npm run infra:up` either way. Changing the variable changes
    # a bind mount, so the container has to be recreated for it to take:
    # `NGINX_CONF=nginx.compose.conf docker compose up -d --force-recreate nginx`.
    volumes:
      - ../nginx/${NGINX_CONF:-nginx.conf}:/etc/nginx/nginx.conf:ro
      # Still mounted under both configs, and read by only one of them:
      # nginx.conf includes conf.d/*.conf, nginx.compose.conf deliberately does
      # not (default.conf's server blocks proxy to the host upstreams and 301
      # port 80 to https, which would undo both halves of the container path).
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/nginx-health']
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  postgres_marketplace_data:
  postgres_grocery_data:
  postgres_restaurant_data:
  postgres_pharmacy_data:
  postgres_doctor_data:
  postgres_hotel_data:
  postgres_taxi_data:
  postgres_franchise_data:
  kafka_data:
  redis_data:
  mongo_data:
  pgadmin_data:
  elasticsearch_data:

networks:
  default:
    name: kartseek-network
