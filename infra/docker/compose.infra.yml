# ─────────────────────────────────────────────────────────────────────────────
# KARTSEEK — Local Infrastructure Stack
#
# ⚠️  SECURITY: every credential below is a REQUIRED variable — `${VAR:?…}`,
# never `${VAR:-a_default}`. Compose refuses to start, naming the variable, if
# the root `.env` is missing or incomplete. That is deliberate: the defaults
# used to be one literal placeholder password, published in tracked source, so a
# deploy that forgot its env file came up *successfully* with a password anyone
# reading this repository already knew (AUD2-022). Failing to start is the
# louder failure, and the only one that cannot be missed.
#
# `${VAR:?…}` only refuses a value that is unset or EMPTY — a placeholder string
# satisfies it — which is why every secret in `.env.example` is left blank and
# `npm run env:init` generates the real ones into the root `.env`, the only file
# Compose reads. Do not `cp .env.example .env`.
#
# Host binding: the datastore ports below publish on ${DB_BIND}, which defaults
# to 127.0.0.1. These are the ports behind a development gateway that may run
# with DEV_AUTH_BYPASS=true, and an unauthenticated Postgres or Redis on a café
# network is a whole-platform compromise. Set DB_BIND=0.0.0.0 in the root .env
# only for a deliberate reason (another machine on the LAN needs the database),
# and set it back afterwards.
#
# The four GUI tools — pgAdmin (5050), Redis Insight (5540), Kibana (5601) and
# Kafka UI (8080) — take the same variable, and did not (IN5 minor). Publishing
# them on every interface undid the datastore binding rather than sitting beside
# it: pgAdmin reaches Postgres over the Compose network whatever DB_BIND says,
# so a laptop with `--profile tools` on an untrusted network was offering the
# database to that network through a web UI while the database's own port was
# correctly closed. Kafka UI is the same shape, and it is not behind a profile
# at all.
#
# Usage:
#   npm run infra:up     → start all services in background
#   npm run infra:down   → stop and remove containers
#   npm run infra:logs   → follow all container logs
#
# After starting: PostgreSQL on 5432, Redis on 6379, Kafka on 9092
#
# Database-per-service:
#   docker compose --profile isolated up -d
# gives each module its own Postgres instance rather than a database inside the
# shared one. Ports 5433-5440, one container each:
#   5433 marketplace   5434 grocery     5435 restaurant   5436 pharmacy
#   5437 doctor        5438 hotel       5439 taxi         5440 franchise
#
# That is nine Postgres containers including the platform one, so expect around
# 1-2 GB of memory for the databases alone. The default `up` leaves them off and
# every module falls back to the shared instance, which is the lighter way to
# work on one module at a time.
#
# Move existing data into them with:
#   npm run db:split -w kartseek-api            (dry run)
#   npm run db:split -w kartseek-api -- --apply
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: kartseek-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the root .env}
      POSTGRES_DB: ${POSTGRES_DB:-kartseek_db}
      # Read by 20-roles.sh, which creates one login role per module schema so a
      # service need not connect as the superuser (AUD2-073). The same eight
      # pairs the `isolated` profile below uses as each dedicated instance's own
      # superuser — one credential per module, valid in either topology. The
      # script exits non-zero, naming the variable, if one is unset: there is no
      # default password.
      MARKETPLACE_DB_USER: ${MARKETPLACE_DB_USER:-marketplace_user}
      MARKETPLACE_DB_PASSWORD: ${MARKETPLACE_DB_PASSWORD:?set MARKETPLACE_DB_PASSWORD in the root .env}
      MARKETPLACE_DB_NAME: ${MARKETPLACE_DB_NAME:-kartseek_marketplace}
      GROCERY_DB_USER: ${GROCERY_DB_USER:-grocery_user}
      GROCERY_DB_PASSWORD: ${GROCERY_DB_PASSWORD:?set GROCERY_DB_PASSWORD in the root .env}
      GROCERY_DB_NAME: ${GROCERY_DB_NAME:-kartseek_grocery}
      RESTAURANT_DB_USER: ${RESTAURANT_DB_USER:-restaurant_user}
      RESTAURANT_DB_PASSWORD: ${RESTAURANT_DB_PASSWORD:?set RESTAURANT_DB_PASSWORD in the root .env}
      RESTAURANT_DB_NAME: ${RESTAURANT_DB_NAME:-kartseek_restaurant}
      PHARMACY_DB_USER: ${PHARMACY_DB_USER:-pharmacy_user}
      PHARMACY_DB_PASSWORD: ${PHARMACY_DB_PASSWORD:?set PHARMACY_DB_PASSWORD in the root .env}
      PHARMACY_DB_NAME: ${PHARMACY_DB_NAME:-kartseek_pharmacy}
      DOCTOR_DB_USER: ${DOCTOR_DB_USER:-doctor_user}
      DOCTOR_DB_PASSWORD: ${DOCTOR_DB_PASSWORD:?set DOCTOR_DB_PASSWORD in the root .env}
      DOCTOR_DB_NAME: ${DOCTOR_DB_NAME:-kartseek_doctor}
      HOTEL_DB_USER: ${HOTEL_DB_USER:-hotel_user}
      HOTEL_DB_PASSWORD: ${HOTEL_DB_PASSWORD:?set HOTEL_DB_PASSWORD in the root .env}
      HOTEL_DB_NAME: ${HOTEL_DB_NAME:-kartseek_hotel}
      TAXI_DB_USER: ${TAXI_DB_USER:-taxi_user}
      TAXI_DB_PASSWORD: ${TAXI_DB_PASSWORD:?set TAXI_DB_PASSWORD in the root .env}
      TAXI_DB_NAME: ${TAXI_DB_NAME:-kartseek_taxi}
      FRANCHISE_DB_USER: ${FRANCHISE_DB_USER:-franchise_user}
      FRANCHISE_DB_PASSWORD: ${FRANCHISE_DB_PASSWORD:?set FRANCHISE_DB_PASSWORD in the root .env}
      FRANCHISE_DB_NAME: ${FRANCHISE_DB_NAME:-kartseek_franchise}
    ports:
      - '${DB_BIND:-127.0.0.1}:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
      # After the extensions, and mounted (not copied) so the by-hand path in
      # infra/docker/README.md can run this same file inside a container whose
      # volume already exists — init scripts run only on an empty data directory.
      - ../postgres/init-roles.sh:/docker-entrypoint-initdb.d/20-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL (Marketplace — dedicated instance) ──────────────────────────
  # Activate with: docker compose --profile marketplace-isolated up -d
  # Then set MARKETPLACE_DB_HOST=localhost MARKETPLACE_DB_PORT=5433 in .env
  postgres-marketplace:
    image: postgis/postgis:16-3.4-alpine
    container_name: kartseek-postgres-marketplace
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MARKETPLACE_DB_USER:-marketplace_user}
      POSTGRES_PASSWORD: ${MARKETPLACE_DB_PASSWORD:?set MARKETPLACE_DB_PASSWORD in the root .env}
      POSTGRES_DB: ${MARKETPLACE_DB_NAME:-kartseek_marketplace}
    ports:
      - '${DB_BIND:-127.0.0.1}:5433:5432'
    volumes:
      - postgres_marketplace_data:/var/lib/postgresql/data
      - ../postgres/init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${MARKETPLACE_DB_USER:-marketplace_user}']
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      # `isolated` brings up every module database at once; the original
      # profile name still works on its own.
      - isolated
      - marketplace-isolated

  # ── PostgreSQL (Grocery — dedicated instance) ──────────────────────────────
  # docker compose --profile isolated up -d
  # Then in apps/api/.env:  GROCERY_DB_HOST=localhost  GROCERY_DB_PORT=5434
  postgres-grocery:
    image: postgis/postgis:16-3.4-alpine
    container_name: kartseek-postgres-grocery
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${GROCERY_DB_USER:-grocery_user}
      POSTGRES_PASSWORD: ${GROCERY_DB_PASSWORD:?set GROCERY_DB_PASSWORD in the root .env}
      POSTGRES_DB: ${GROCERY_DB_NAME:-kartseek_grocery}
    ports:
      - '${DB_BIND:-127.0.0.1}:5434:5432'
    volumes:
      - postgres_grocery_data:/var/lib/postgresql/data
      - ../postgres/init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${GROCERY_DB_USER:-grocery_user}']
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - isolated

  # ── PostgreSQL (Restaurant — dedicated instance) ──────────────────────────────
  # docker compose --profile isolated up -d
  # Then in apps/api/.env:  RESTAURANT_DB_HOST=localhost  RESTAURANT_DB_PORT=5435
  postgres-restaurant:
    image: postgis/postgis:16-3.4-alpine
    container_name: kartseek-postgres-restaurant
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${RESTAURANT_DB_USER:-restaurant_user}
      POSTGRES_PASSWORD: ${RESTAURANT_DB_PASSWORD:?set RESTAURANT_DB_PASSWORD in the root .env}
      POSTGRES_DB: ${RESTAURANT_DB_NAME:-kartseek_restaurant}
    ports:
      - '${DB_BIND:-127.0.0.1}:5435:5432'
    volumes:
      - postgres_restaurant_data:/var/lib/postgresql/data
      - ../postgres/init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${RESTAURANT_DB_USER:-restaurant_user}']
      interval: 10s
      timeout: 5s
      retries: 5
