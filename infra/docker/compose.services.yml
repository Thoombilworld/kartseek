  taxi-service:
    build:
      context: .
      dockerfile: infra/docker/module-service.Dockerfile
      args:
        APP: taxi
        PORT: '3021'
        HEALTH_PATH: /health
    image: kartseek/taxi-service:${KARTSEEK_TAG:-dev}
    container_name: kartseek-taxi-service
    restart: unless-stopped
    profiles: [admin, full]
    env_file:
      - path: .env
        required: true
      - path: apps/api/.env
        required: false
      - path: modules/taxi/backend/.env
        required: false
    environment:
      # The image sets this too, but apps/api/.env says development and env_file
      # wins over the image. Production here also makes the gateway bind 0.0.0.0.
      # DEV_AUTH_BYPASS is pinned rather than left to the NODE_ENV gate in
      # jwt-auth.guard.ts: one gate is not where an anonymous SUPER_ADMIN belongs.
      NODE_ENV: production
      DEV_AUTH_BYPASS: 'false'
      # Platform secrets, from the ROOT .env — never from a workspace .env, whose
      # dev values are exactly what NODE_ENV=production refuses.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the root .env — run npm run env:init}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in the root .env — run npm run env:init}
      # This service's own HTTP bind address. marketplace-service reads
      # MARKETPLACE_HTTP_HOST and defaults to LOOPBACK — defence in depth for a
      # health-only surface — so without this its published port accepts the
      # connection and answers nothing, while its own HEALTHCHECK (which runs
      # INSIDE the container, on that same loopback) still reports healthy.
      # Emitted for every Nest service under its own stem rather than for the
      # one that reads it today, so the next service to adopt the pattern is
      # container-correct by default; it is inert for the other twenty-five.
      #
      # NOT the gateway bind. api-gateway/src/main.ts reads API_GATEWAY_HOST —
      # one word shorter — and that is the documented override for the
      # DEV_AUTH_BYPASS loopback rule. API_GATEWAY_HTTP_HOST below is read by
      # nothing; setting it does not move the gateway bind.
      TAXI_HTTP_HOST: '0.0.0.0'
      # Infrastructure, by its compose service name — the whole set, whether or not
      # this service declares the dependency: depends_on below is what expresses
      # one, and apps/api/.env would otherwise leave the unclaimed ones pointing
      # at the developer’s own machine.
      DB_HOST: postgres
      DB_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BROKERS: kafka:29092
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB_NAME:-kartseek_catalog}?authSource=admin
      ELASTICSEARCH_NODE: http://elastic:${ELASTIC_PASSWORD}@elasticsearch:9200
      # Every module database: one schema each, inside the shared one.
      DOCTOR_DB_HOST: postgres
      DOCTOR_DB_PORT: '5432'
      DOCTOR_DB_NAME: ${POSTGRES_DB:-kartseek_db}
      FRANCHISE_DB_HOST: postgres
      FRANCHISE_DB_PORT: '5432'
      FRANCHISE_DB_NAME: ${POSTGRES_DB:-kartseek_db}
      GROCERY_DB_HOST: postgres
      GROCERY_DB_PORT: '5432'
      GROCERY_DB_NAME: ${POSTGRES_DB:-kartseek_db}
      HOTEL_DB_HOST: postgres
      HOTEL_DB_PORT: '5432'
      HOTEL_DB_NAME: ${POSTGRES_DB:-kartseek_db}
      MARKETPLACE_DB_HOST: postgres
      MARKETPLACE_DB_PORT: '5432'
      MARKETPLACE_DB_NAME: ${POSTGRES_DB:-kartseek_db}
      PHARMACY_DB_HOST: postgres
      PHARMACY_DB_PORT: '5432'
      PHARMACY_DB_NAME: ${POSTGRES_DB:-kartseek_db}
      RESTAURANT_DB_HOST: postgres
      RESTAURANT_DB_PORT: '5432'
      RESTAURANT_DB_NAME: ${POSTGRES_DB:-kartseek_db}
      TAXI_DB_HOST: postgres
      TAXI_DB_PORT: '5432'
      TAXI_DB_NAME: ${POSTGRES_DB:-kartseek_db}
      # How this service signs in, and no SSL — the images run NODE_ENV=production,
      # which turns SSL on by default, and this Postgres speaks plaintext on a
      # private network.
      TAXI_DB_USER: ${TAXI_DB_USER:-taxi_user}
      TAXI_DB_PASSWORD: ${TAXI_DB_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-kartseek_db}
      DB_USER: ${TAXI_DB_USER:-taxi_user}
      DB_PASSWORD: ${TAXI_DB_PASSWORD}
