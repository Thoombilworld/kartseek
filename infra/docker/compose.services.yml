  web:
    build:
      context: .
      dockerfile: infra/docker/nextjs.Dockerfile
      args:
        WORKSPACE_DIR: apps/web
        PORT: '3000'
        HEALTH_PATH: /admin/login
        NEXT_PUBLIC_API_URL: ${COMPOSE_API_URL:-http://nginx/api/v1}
        NEXT_PUBLIC_WS_URL: ${COMPOSE_WS_URL:-ws://nginx}
        API_URL: http://api-gateway:3001/api/v1
    image: kartseek/web:${KARTSEEK_TAG:-dev}
    container_name: kartseek-web
    restart: unless-stopped
    profiles: [admin, full]
    environment:
      # The image already sets this; nothing here may put it back.
      NODE_ENV: production
      # Server-side fetches go straight to the gateway container, and so do the
      # two `/api/*` rewrites in next.config.mjs — API_GATEWAY_ORIGIN falls back
      # to the loopback address there, which inside this container is this
      # container. The browser uses the build-time NEXT_PUBLIC_API_URL above.
      API_URL: http://api-gateway:3001/api/v1
      API_GATEWAY_ORIGIN: http://api-gateway:3001
      # Where the shell rewrites each vertical path (next.config.mjs).
      MARKETPLACE_ZONE_ORIGIN: http://marketplace-frontend:3002
      GROCERY_ZONE_ORIGIN: http://grocery-frontend:3003
      RESTAURANT_ZONE_ORIGIN: http://restaurant-frontend:3004
