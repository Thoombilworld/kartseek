      TAXI_ZONE_ORIGIN: http://taxi-frontend:3008
      FRANCHISE_ZONE_ORIGIN: http://franchise-frontend:3009
    ports:
      - '${APP_BIND:-127.0.0.1}:3000:3000'
    healthcheck:
