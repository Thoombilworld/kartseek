# ══════════════════════════════════════════════════════════════════════════════
# KARTSEEK API Gateway Deployment
# Deploy: kubectl apply -f infra/k8s/api-gateway.yaml
# ══════════════════════════════════════════════════════════════════════════════

---
# ── Service: API Gateway (ClusterIP) ───────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: kartseek
  labels:
    app: api-gateway
    tier: gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      protocol: TCP
      port: 3001
      targetPort: 3001
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: 9090
  sessionAffinity: None

---
# ── Deployment: API Gateway ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: kartseek
  labels:
    app: api-gateway
    tier: gateway
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: gateway
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9090'
        prometheus.io/path: '/metrics'
    spec:
      serviceAccountName: api-gateway
      # 1001, not 1000: infra/docker/api-gateway.Dockerfile ends `USER nestjs`,
      # created with `adduser --system --uid 1001`. A runAsUser that disagrees
      # with the image is one of the things `--validate=strict` cannot see
      # (2026-08-13 audit) — the pod starts as a uid with no passwd entry and
      # no ownership of anything the build chowned.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

      # ── Image Pull Policy ──────────────────────────────────────────────────
      imagePullSecrets:
        - name: regcred

      # ── Init Containers (run before main container) ───────────────────────
      # `resources` is mandatory here, not tidiness: the namespace ResourceQuota
      # tracks requests/limits and its admission check walks init containers too,
      # so a resourceless init container makes the whole pod un-creatable.
      #
      # One per entry in this service's `dependsOn` in services.yaml, the same
      # list the generated manifests and Compose both read — postgres, redis,
      # kafka, mongodb.
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            [
              'sh',
              '-c',
              'until nc -z postgres.kartseek.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done',
            ]
          resources:
            requests: { cpu: '10m', memory: '16Mi' }
            limits: { cpu: '50m', memory: '64Mi' }
        - name: wait-for-redis
          image: busybox:1.36
          command:
            [
              'sh',
              '-c',
              'until nc -z redis.kartseek.svc.cluster.local 6379; do echo waiting for redis; sleep 2; done',
            ]
          resources:
            requests: { cpu: '10m', memory: '16Mi' }
            limits: { cpu: '50m', memory: '64Mi' }
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            [
              'sh',
              '-c',
              'until nc -z kafka.kartseek.svc.cluster.local 9092; do echo waiting for kafka; sleep 2; done',
            ]
          resources:
            requests: { cpu: '10m', memory: '16Mi' }
            limits: { cpu: '50m', memory: '64Mi' }
        - name: wait-for-mongodb
          image: busybox:1.36
          command:
            [
              'sh',
              '-c',
              'until nc -z mongodb.kartseek.svc.cluster.local 27017; do echo waiting for mongodb; sleep 2; done',
            ]
          resources:
            requests: { cpu: '10m', memory: '16Mi' }
            limits: { cpu: '50m', memory: '64Mi' }

      # ── Containers ─────────────────────────────────────────────────────────
      containers:
        - name: api-gateway
          image: kartseek/api-gateway:${KARTSEEK_TAG}
          imagePullPolicy: IfNotPresent

          # ── Environment Variables ──────────────────────────────────────────
          # envFrom, not a hand-picked list of keys. The gateway holds a client
          # for all 26 services, and the previous list named exactly one of them
          # (AUTH_*). Every other *_SERVICE_HOST, *_TCP_PORT and *_GRPC_URL was
          # simply absent from the pod, so each client silently fell back to its
          # compiled-in localhost default and dialled the gateway itself.
          # Enumerating ~60 keys by hand is how that drift happened; don't go back.
          envFrom:
            - configMapRef:
                name: kartseek-config
            - secretRef:
                name: kartseek-secrets

          env:
            # ── Pod Metadata (for logging) ────────────────────────────────
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

            # ── Postgres ──────────────────────────────────────────────────
            # The Secret calls it POSTGRES_PASSWORD — the name .env.example,
            # Compose and the Postgres StatefulSet all use — and this service
            # reads DB_PASSWORD. Everything else about the connection is in the
            # ConfigMap.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kartseek-secrets
                  key: POSTGRES_PASSWORD

            # ── Mongo ─────────────────────────────────────────────────────
            # Assembled by the kubelet from keys `envFrom` has already brought
            # in — MONGO_ROOT_USER and MONGO_DB_NAME from the ConfigMap,
            # MONGO_ROOT_PASSWORD from the Secret — so the URI's shape is in
            # the manifest and the password is not. Without it the gateway's
            # Mongo client falls back to localhost, which in a pod is the pod
            # (AUD2-028).
            - name: MONGO_URI
              value: 'mongodb://$(MONGO_ROOT_USER):$(MONGO_ROOT_PASSWORD)@mongodb.kartseek.svc.cluster.local:27017/$(MONGO_DB_NAME)?authSource=admin'

          # ── Ports ──────────────────────────────────────────────────────────
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP

          # ── Health Checks ──────────────────────────────────────────────────
          # /health is a 404 here. main.ts sets the global prefix `api` and
          # enables URI versioning, so the routes are /api/v1/health and
          # /api/v1/health/ready — all three probes pointed at the bare paths,
          # which is a rollout that never passes readiness and crash-loops on
          # liveness (AUD2-001). The paths come from this service's own
          # `health` block in services.yaml, and k8s.test.mjs asserts they
          # still agree.
          #
          # No initialDelaySeconds on liveness or readiness: the startupProbe
          # below holds both off until the process answers at all, and a delay
          # next to it only makes a healthy pod look slow.
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # 503 while a dependency is down, 200 while it is merely degraded
          # (IN1), so a warm-cache problem does not empty the Service.
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

          # 30 x 10s = 300s before liveness may kill a pod that is still booting.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30

          # ── Resource Limits ────────────────────────────────────────────────
          resources:
            requests:
              cpu: '500m'
              memory: '512Mi'
            limits:
              cpu: '1000m'
              memory: '1Gi'

          # ── Security Context ──────────────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              # NET_BIND_SERVICE was granted back after dropping ALL, but it only
              # matters below port 1024 and the gateway listens on 3001.
              drop:
                - ALL

          # ── Volume Mounts ────────────────────────────────────────────────
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-logs
              mountPath: /app/logs

      # ── Volumes ────────────────────────────────────────────────────────────
      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-logs
          emptyDir: {}

      # ── Node Affinity (ensure diverse node distribution) ──────────────────
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - api-gateway
                topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: In
                    values:
                      - 'true'

      # ── Termination Grace Period ───────────────────────────────────────────
      terminationGracePeriodSeconds: 30

      # ── DNS Policy ─────────────────────────────────────────────────────────
      dnsPolicy: ClusterFirst

---
# ── HorizontalPodAutoscaler: Auto-scale API Gateway ──────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: kartseek
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
    # ── CPU-based scaling ──────────────────────────────────────────────────
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # ── Memory-based scaling ───────────────────────────────────────────────
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60

---
# ── PodDisruptionBudget: Ensure availability during node maintenance ──────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: kartseek
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: api-gateway
