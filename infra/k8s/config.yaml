# ══════════════════════════════════════════════════════════════════════════════
# KARTSEEK Kubernetes ConfigMap & Secrets
# Deploy: kubectl apply -f infra/k8s/config.yaml
# ══════════════════════════════════════════════════════════════════════════════

---
# ── ConfigMap: Application Configuration ───────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: kartseek-config
  namespace: kartseek
  labels:
    app.kubernetes.io/name: kartseek
data:
  # ── Application ────────────────────────────────────────────────────────────
  NODE_ENV: 'production'
  API_GATEWAY_PORT: '3001'
  SKIP_DB: 'false'
  SKIP_KAFKA: 'false'
  SKIP_REDIS: 'false'

  # ── Database (PostgreSQL) ──────────────────────────────────────────────────
  DB_HOST: 'postgres.kartseek.svc.cluster.local'
  DB_PORT: '5432'
  DB_USER: 'postgres'
  DB_NAME: 'kartseek_db'
  # Multiple services share this database; letting each one ALTER the shared
  # tables to match its own entities makes the schema depend on boot order
  # (and drops non-entity indexes). Migrations only.
  DB_SYNCHRONIZE: 'false'
  # The images run NODE_ENV=production, which turns SSL on by default, and the
  # Postgres in databases.yaml speaks plaintext on the pod network. Flip this to
  # "true" the day this points at a managed instance (RDS/CloudSQL), which does
  # require TLS — and then the shared instance's StatefulSet can go.
  DB_SSL: 'false'
  # DB_PASSWORD is NOT here. Every Deployment maps it from the Secret's
  # POSTGRES_PASSWORD, which is the name the root .env.example documents.

  # ── Redis ──────────────────────────────────────────────────────────────────
  REDIS_HOST: 'redis.kartseek.svc.cluster.local'
  REDIS_PORT: '6379'

  # ── JWT / Auth ─────────────────────────────────────────────────────────────
  # SECONDS, not a duration string. The gateway and auth-service both validate
  # this with `Joi.number()`; "1h" fails conversion, ConfigModule throws, and the
  # pod never finishes booting. 900 = 15 minutes.
  JWT_EXPIRES_IN: '900'
  JWT_REFRESH_EXPIRES_IN: '7d'

  # ── CSRF (see env.validation.ts) ───────────────────────────────────────────
  CSRF_ENABLED: 'true'
  CSRF_COOKIE_SECURE: 'true'
  CSRF_COOKIE_SAMESITE: 'Strict'

  # ── Kafka ──────────────────────────────────────────────────────────────────
  KAFKA_BROKERS: 'kafka-0.kafka.kartseek.svc.cluster.local:9092'
  KAFKA_CLIENT_ID: 'kartseek-api'
  # The fallback only. One group id shared by 19 services is a rebalance storm
  # and a reply misrouted to whichever consumer got the partition; the three
  # services that actually consume declare their own `kafka.groupId` in
  # services.yaml and the generated Deployment overrides this for them.
  KAFKA_GROUP_ID: 'kartseek-consumer'

  # ── gRPC ───────────────────────────────────────────────────────────────────
  GRPC_HOST: '0.0.0.0'
  GRPC_PORT: '50051'

  # ══════════════════════════════════════════════════════════════════════════
  # SERVICE ADDRESSING
  # ══════════════════════════════════════════════════════════════════════════
  # Three independent listeners per service, and three independent sets of keys.
  # Mixing them up is the single most common way to break this deployment:
  #
  #   <SVC>_SERVICE_PORT  the port the service's OWN HTTP server binds (probes).
  #                       Must equal the containerPort/probe port in the manifest.
  #   <SVC>_TCP_PORT      the Nest TCP microservice transport the GATEWAY dials.
  #   <SVC>_GRPC_PORT     the gRPC transport the service binds.
  #   <SVC>_SERVICE_HOST  cluster DNS name the gateway dials for TCP.
  #   <SVC>_GRPC_URL      host:port the gateway dials for gRPC.
  #
  # Every value below is taken from the service's own main.ts. Seven of the
  # *_SERVICE_PORT values here used to hold a *TCP* port instead: admin (4017),
  # doctor (4007), grocery (4008) and pharmacy (4010) each made the service bind
  # its HTTP server to the port its own TCP transport already held (EADDRINUSE at
  # boot), while restaurant (4009), taxi (4011) and notification (4016) pointed
  # at ports nothing binds, so the kubelet probe never came up.

  # ── Cluster DNS names (gateway → service, TCP transport) ───────────────────
  AUTH_SERVICE_HOST: 'auth-service.kartseek.svc.cluster.local'
  USER_SERVICE_HOST: 'user-service.kartseek.svc.cluster.local'
  ORDER_SERVICE_HOST: 'order-service.kartseek.svc.cluster.local'
  PAYMENT_SERVICE_HOST: 'payment-service.kartseek.svc.cluster.local'
  MARKETPLACE_SERVICE_HOST: 'marketplace-service.kartseek.svc.cluster.local'
  CART_SERVICE_HOST: 'cart-service.kartseek.svc.cluster.local'
  LOYALTY_SERVICE_HOST: 'loyalty-service.kartseek.svc.cluster.local'
  FRANCHISE_SERVICE_HOST: 'franchise-service.kartseek.svc.cluster.local'
  DOCTOR_SERVICE_HOST: 'doctor-service.kartseek.svc.cluster.local'
  GROCERY_SERVICE_HOST: 'grocery-service.kartseek.svc.cluster.local'
  PHARMACY_SERVICE_HOST: 'pharmacy-service.kartseek.svc.cluster.local'
  LOCATION_SERVICE_HOST: 'location-service.kartseek.svc.cluster.local'
  WALLET_SERVICE_HOST: 'wallet-service.kartseek.svc.cluster.local'
  ADMIN_SERVICE_HOST: 'admin-service.kartseek.svc.cluster.local'
  RESTAURANT_SERVICE_HOST: 'restaurant-service.kartseek.svc.cluster.local'
  COMMISSION_SERVICE_HOST: 'commission-service.kartseek.svc.cluster.local'
  PAYOUT_SERVICE_HOST: 'payout-service.kartseek.svc.cluster.local'
  REFUND_SERVICE_HOST: 'refund-service.kartseek.svc.cluster.local'
  SEARCH_SERVICE_HOST: 'search-service.kartseek.svc.cluster.local'
  REPORT_SERVICE_HOST: 'report-service.kartseek.svc.cluster.local'
  HOTEL_SERVICE_HOST: 'hotel-service.kartseek.svc.cluster.local'
  TAXI_SERVICE_HOST: 'taxi-service.kartseek.svc.cluster.local'
  NOTIFICATION_SERVICE_HOST: 'notification-service.kartseek.svc.cluster.local'
  DELIVERY_SERVICE_HOST: 'delivery-service.kartseek.svc.cluster.local'
  AUDIT_LOG_SERVICE_HOST: 'audit-log-service.kartseek.svc.cluster.local'
  # Seller is the seller-facing surface of the Marketplace module, not a service
  # of its own — the gateway's SELLER_SERVICE token resolves to marketplace.
  SELLER_SERVICE_HOST: 'marketplace-service.kartseek.svc.cluster.local'

  # ── HTTP ports (each service's own listen(), and its probe target) ─────────
  AUTH_SERVICE_PORT: '3010'
  USER_SERVICE_PORT: '3011'
  MARKETPLACE_SERVICE_PORT: '3012'
  CART_SERVICE_PORT: '3013'
  ORDER_SERVICE_PORT: '3014'
  LOYALTY_SERVICE_PORT: '3015'
  FRANCHISE_SERVICE_PORT: '3016'
  DOCTOR_SERVICE_PORT: '3017'
  GROCERY_SERVICE_PORT: '3018'
  RESTAURANT_SERVICE_PORT: '3019'
  PHARMACY_SERVICE_PORT: '3020'
  TAXI_SERVICE_PORT: '3021'
  DELIVERY_SERVICE_PORT: '3022'
  LOCATION_SERVICE_PORT: '3023'
  WALLET_SERVICE_PORT: '3024'
  PAYMENT_SERVICE_PORT: '3025'
  NOTIFICATION_SERVICE_PORT: '3026'
  ADMIN_SERVICE_PORT: '3027'
  AUDIT_LOG_SERVICE_PORT: '3028'
  COMMISSION_SERVICE_PORT: '3030'
  PAYOUT_SERVICE_PORT: '3031'
  REFUND_SERVICE_PORT: '3032'
  SEARCH_SERVICE_PORT: '3033'
  REPORT_SERVICE_PORT: '3034'
  HOTEL_SERVICE_PORT: '3035'

  # ── TCP transport ports (what the gateway's ClientProxy dials) ─────────────
  MARKETPLACE_TCP_PORT: '4002'
  CART_TCP_PORT: '4003'
  ORDER_TCP_PORT: '4004'
  LOYALTY_TCP_PORT: '4005'
  FRANCHISE_TCP_PORT: '4006'
  DOCTOR_TCP_PORT: '4007'
  GROCERY_TCP_PORT: '4008'
  PHARMACY_TCP_PORT: '4010'
  LOCATION_TCP_PORT: '4013'
  WALLET_TCP_PORT: '4014'
  ADMIN_TCP_PORT: '4017'
  AUDIT_LOG_TCP_PORT: '4028'
  RESTAURANT_TCP_PORT: '4018'
  COMMISSION_TCP_PORT: '4020'
  PAYOUT_TCP_PORT: '4021'
  REFUND_TCP_PORT: '4022'
  SEARCH_TCP_PORT: '4023'
  REPORT_TCP_PORT: '4024'
  HOTEL_TCP_PORT: '4025'
  PAYMENT_TCP_PORT: '4026'
  TAXI_TCP_PORT: '4027'

  # Hotel and Payment were the only two services binding their TCP transport to
  # 127.0.0.1. That is unreachable from another pod, so every gateway call to
  # them returned ECONNREFUSED. They now honour these, like the other 18.
  HOTEL_TCP_HOST: '0.0.0.0'
  PAYMENT_TCP_HOST: '0.0.0.0'

  # ── gRPC server bind ports ────────────────────────────────────────────────
  AUTH_GRPC_PORT: '5001'
  ORDER_GRPC_PORT: '5002'
  PAYMENT_GRPC_PORT: '5003'
  NOTIFICATION_GRPC_PORT: '5004'
  RESTAURANT_GRPC_PORT: '5005'
  MARKETPLACE_GRPC_PORT: '5006'
  TAXI_GRPC_PORT: '5007'
  DELIVERY_GRPC_PORT: '5008'
  USER_GRPC_PORT: '5009'
  GROCERY_GRPC_PORT: '5010'

  # ── gRPC client URLs (gateway → service) ──────────────────────────────────
  # GrpcLibModule.register() falls back to "localhost:5000" when these are unset,
  # which resolves to the gateway pod itself and answers nothing. The key names
  # are derived as `<token>` minus a trailing _GRPC, so they are not uniform —
  # they match apps/api/libs/grpc/src/grpc.module.ts exactly.
  AUTH_SERVICE_GRPC_URL: 'auth-service.kartseek.svc.cluster.local:5001'
  USER_SERVICE_GRPC_URL: 'user-service.kartseek.svc.cluster.local:5009'
  ORDER_SERVICE_GRPC_URL: 'order-service.kartseek.svc.cluster.local:5002'
  PAYMENT_SERVICE_GRPC_URL: 'payment-service.kartseek.svc.cluster.local:5003'
  NOTIFICATION_GRPC_URL: 'notification-service.kartseek.svc.cluster.local:5004'
  RESTAURANT_GRPC_URL: 'restaurant-service.kartseek.svc.cluster.local:5005'
  MARKETPLACE_GRPC_URL: 'marketplace-service.kartseek.svc.cluster.local:5006'
  TAXI_SERVICE_GRPC_URL: 'taxi-service.kartseek.svc.cluster.local:5007'
  DELIVERY_GRPC_URL: 'delivery-service.kartseek.svc.cluster.local:5008'
  GROCERY_GRPC_URL: 'grocery-service.kartseek.svc.cluster.local:5010'

  # ══════════════════════════════════════════════════════════════════════════
  # MODULE DATABASES
  # ══════════════════════════════════════════════════════════════════════════
  # Seven of the eight module services had no `<MODULE>_DB_*` keys at all, so
  # each fell back to DB_HOST/DB_NAME above: the shared kartseek_db, reached as
  # the superuser (AUD2-027).
  #
  # What they get instead is NOT seven more Postgres instances. A module owns a
  # SCHEMA inside the shared database and connects as its own login role —
  # `grocery_user` and the other seven, created by
  # infra/postgres/init-roles.sh, which databases.yaml mounts into the Postgres
  # StatefulSet exactly as Compose mounts it (IN4/IN5). So the five things a
  # module needs are its host, port, database, role and password; the first four
  # are here and the password is in the Secret, never here.
  #
  # `<MODULE>_DB_NAME` is the SHARED database in every case. The
  # `kartseek_<module>` names in the root .env belong to Compose's `isolated`
  # profile, where each module gets an instance of its own.
  #
  # Marketplace included, now. It used to point at a dedicated
  # `postgres-marketplace` instance and `kartseek_marketplace`, while Compose put
  # the same service on the shared `postgres` as a tenant role — the platform's
  # highest-volume module running against a different database depending on which
  # stack you started, and nothing that could notice if the two schemas drifted.
  # The ruling is one topology: shared instance, `marketplace_user`, everywhere.
  # The dedicated StatefulSet stays in databases.yaml as the documented
  # `isolated` option and is referenced by no Deployment.
  MARKETPLACE_DB_HOST: 'postgres.kartseek.svc.cluster.local'
  MARKETPLACE_DB_PORT: '5432'
  MARKETPLACE_DB_NAME: 'kartseek_db'
  MARKETPLACE_DB_USER: 'marketplace_user'

  GROCERY_DB_HOST: 'postgres.kartseek.svc.cluster.local'
  GROCERY_DB_PORT: '5432'
  GROCERY_DB_NAME: 'kartseek_db'
  GROCERY_DB_USER: 'grocery_user'

  RESTAURANT_DB_HOST: 'postgres.kartseek.svc.cluster.local'
  RESTAURANT_DB_PORT: '5432'
  RESTAURANT_DB_NAME: 'kartseek_db'
  RESTAURANT_DB_USER: 'restaurant_user'

  PHARMACY_DB_HOST: 'postgres.kartseek.svc.cluster.local'
  PHARMACY_DB_PORT: '5432'
  PHARMACY_DB_NAME: 'kartseek_db'
  PHARMACY_DB_USER: 'pharmacy_user'

  DOCTOR_DB_HOST: 'postgres.kartseek.svc.cluster.local'
  DOCTOR_DB_PORT: '5432'
  DOCTOR_DB_NAME: 'kartseek_db'
  DOCTOR_DB_USER: 'doctor_user'

  HOTEL_DB_HOST: 'postgres.kartseek.svc.cluster.local'
  HOTEL_DB_PORT: '5432'
  HOTEL_DB_NAME: 'kartseek_db'
  HOTEL_DB_USER: 'hotel_user'

  TAXI_DB_HOST: 'postgres.kartseek.svc.cluster.local'
  TAXI_DB_PORT: '5432'
  TAXI_DB_NAME: 'kartseek_db'
  TAXI_DB_USER: 'taxi_user'

  FRANCHISE_DB_HOST: 'postgres.kartseek.svc.cluster.local'
  FRANCHISE_DB_PORT: '5432'
  FRANCHISE_DB_NAME: 'kartseek_db'
  FRANCHISE_DB_USER: 'franchise_user'

  # Probes arrive on the pod IP, not loopback, so the health listener has to bind
  # wide here. HttpSurfaceGuard is what keeps that safe: /health is the only route
  # the HTTP surface serves. The generated manifests emit the same key under each
  # service's own stem.
  MARKETPLACE_HTTP_HOST: '0.0.0.0'

  # ── MongoDB ────────────────────────────────────────────────────────────────
  # audit-log-service was deployed with no Mongo anywhere in these manifests, so
  # `resolveAuditUri` fell back to mongodb://localhost:27017 — and in a pod,
  # localhost is the pod: the admin audit trail had no datastore at all
  # (AUD2-028). databases.yaml now ships the StatefulSet, and each Deployment
  # that declares the dependency assembles MONGO_URI from these plus the
  # Secret's MONGO_ROOT_PASSWORD.
  MONGO_HOST: 'mongodb.kartseek.svc.cluster.local'
  MONGO_PORT: '27017'
  MONGO_ROOT_USER: 'admin'
  MONGO_DB_NAME: 'kartseek_catalog'

  # ── Elasticsearch ──────────────────────────────────────────────────────────
  # Same shape for search-service (AUD2-029). ELASTICSEARCH_NODE carries the
  # credential, so it is assembled per-Deployment from the Secret's
  # ELASTIC_PASSWORD rather than written here.
  ELASTICSEARCH_HOST: 'elasticsearch.kartseek.svc.cluster.local'
  ELASTICSEARCH_PORT: '9200'
  ELASTICSEARCH_INDEX_PREFIX: 'kartseek_'

  # ── Storage ────────────────────────────────────────────────────────────────
  STORAGE_PROVIDER: 's3'
  CDN_DOMAIN: 'cdn.kartseek.com'
  AWS_REGION: 'ap-south-1'

  # ── Email (SMTP) ───────────────────────────────────────────────────────────
  SMTP_HOST: 'smtp.sendgrid.net'
  SMTP_PORT: '587'
  SMTP_FROM: 'noreply@kartseek.com'

  # ── Logging & Monitoring ──────────────────────────────────────────────────
  LOG_LEVEL: 'info'
  ENABLE_METRICS: 'true'
  METRICS_PORT: '9090'

---
# ── Secret: the names, and nothing else ───────────────────────────────────────
#
# EVERY VALUE HERE IS EMPTY, AND MUST STAY EMPTY. This document is the list of
# credential NAMES the platform reads, so that a missing one is a visible gap
# rather than a service that boots and fails later. The values are filled by the
# deploy pipeline, from a secret store, and never by editing this file.
#
# It used to hold literals: one shouting "use a secrets manager" placeholder for
# four passwords, a JWT secret containing the word `change` (which the gateway's
# own Joi schema then refuses under NODE_ENV=production), an all-zero
# ENCRYPTION_KEY and a set of plausible-looking payment keys. A placeholder in
# tracked source is a password everyone reading this repository already knows,
# and the manifests are the last place one belongs (AUD2-022 said the same of
# Compose).
#
# ── Filling it: one way, and it is a script ──────────────────────────────────
#
#   ./infra/k8s/deploy.sh dev
#
# `deploy.sh` reads the repository-root `.env` (and `apps/api/.env` for the
# integration keys), takes the NAMES from this document, builds the Secret from
# the two, and refuses to go on if a required one is missing or empty — naming
# it. There is deliberately no copy-pasteable `kubectl create secret` here any
# more: the one that was here lost its line continuations in an edit, and pasted
# it created an EMPTY kartseek-secrets that the deploy then found and left alone,
# which is a whole cluster running on blank credentials. A script cannot be
# half-pasted. `SECRETS_ENV_FILE=<file>` overrides where the values come from.
#
# ── Required, and optional ───────────────────────────────────────────────────
#
# A key marked `# optional` below is a third-party integration whose absence
# fails at that integration's own boundary; `deploy.sh` names the absent ones and
# continues. Everything else is the platform's own and the deploy stops without
# it. The required names are the ones the repository-root `.env.example`
# documents; the optional ones are documented in `apps/api/.env.example`.
#
# In production, use the External Secrets Operator (https://external-secrets.io/)
# with a SecretStore pointing at AWS Secrets Manager / Vault, and let it own this
# Secret's contents.
apiVersion: v1
kind: Secret
metadata:
  name: kartseek-secrets
  namespace: kartseek
  labels:
    app.kubernetes.io/name: kartseek
type: Opaque
stringData:
  # ── Datastores ───────────────────────────────────────────────────────────
  # POSTGRES_PASSWORD, not DB_PASSWORD: it is the name .env.example, Compose and
  # the Postgres StatefulSet all use, and each Deployment maps it to the
  # DB_PASSWORD its service reads.
  POSTGRES_PASSWORD: ''
  REDIS_PASSWORD: ''
  MONGO_ROOT_PASSWORD: ''
  ELASTIC_PASSWORD: ''

  # ── One login role per module (infra/postgres/init-roles.sh) ─────────────
  # The Postgres StatefulSet reads these to CREATE the roles; each module
  # service reads its own to connect as one. Same pair either way, so moving a
  # module onto its own instance does not change its credential.
  MARKETPLACE_DB_PASSWORD: ''
  GROCERY_DB_PASSWORD: ''
  RESTAURANT_DB_PASSWORD: ''
  PHARMACY_DB_PASSWORD: ''
  DOCTOR_DB_PASSWORD: ''
  HOTEL_DB_PASSWORD: ''
  TAXI_DB_PASSWORD: ''
  FRANCHISE_DB_PASSWORD: ''

  # ── Platform secrets ─────────────────────────────────────────────────────
  # JWT_SECRET is rejected by env.validation.ts under NODE_ENV=production if it
  # contains dev/test/change/example/placeholder; ENCRYPTION_KEY must be exactly
  # 64 hex characters (AES-256-GCM's 32 bytes). `npm run env:init` generates both.
  # JWT_REFRESH_SECRET was here too and is read by nothing in apps/api.
  JWT_SECRET: ''
  ENCRYPTION_KEY: ''

  # ── Third-party integrations ─────────────────────────────────────────────
  # Names only, as above, and every one marked optional: a service that needs one
  # and is given an empty string fails at its own boundary, which is where that
  # failure is legible. `deploy.sh` lists the absent ones and carries on, rather
  # than blocking a dev cluster on a Twilio account nobody has. These names are
  # documented in apps/api/.env.example, not the repository-root one.
  RAZORPAY_KEY_ID: '' # optional
  RAZORPAY_KEY_SECRET: '' # optional
  RAZORPAY_WEBHOOK_SECRET: '' # optional
  STRIPE_SECRET_KEY: '' # optional
  STRIPE_WEBHOOK_SECRET: '' # optional
  AWS_ACCESS_KEY_ID: '' # optional
  AWS_SECRET_ACCESS_KEY: '' # optional
  S3_BUCKET: '' # optional
  SMTP_USER: '' # optional
  SMTP_PASS: '' # optional
  TWILIO_ACCOUNT_SID: '' # optional
  TWILIO_AUTH_TOKEN: '' # optional
  TWILIO_PHONE_NUMBER: '' # optional
  FIREBASE_SERVICE_ACCOUNT_KEY: '' # optional
---
# ── Secret: Docker Registry (for pulling images from private registry) ────────
# Create via:
#   kubectl create secret docker-registry regcred \
#     --docker-server=docker.io \
#     --docker-username=<username> \
#     --docker-password=<password> \
#     --docker-email=<email> \
#     --namespace=kartseek
#
# Already created by: kubectl create secret docker-registry regcred ...

---
# ── Secret: TLS Certificate for Ingress ───────────────────────────────────────
# Create via:
#   kubectl create secret tls kartseek-tls \
#     --cert=path/to/tls.crt \
#     --key=path/to/tls.key \
#     --namespace=kartseek
#
# Or use cert-manager: https://cert-manager.io/
