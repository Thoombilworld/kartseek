# ══════════════════════════════════════════════════════════════════════════════
# KARTSEEK — Marketplace Service HorizontalPodAutoscaler
# Deploy: kubectl apply -f infra/k8s/marketplace-hpa.yaml
#
# Requires metrics-server to be installed in the cluster:
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
# ══════════════════════════════════════════════════════════════════════════════

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: marketplace-service-hpa
  namespace: kartseek
  labels:
    app: marketplace-service
    tier: microservice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: marketplace-service

  # ── Scaling bounds ──────────────────────────────────────────────────────────
  minReplicas: 2
  maxReplicas: 10

  # ── Scaling metrics ─────────────────────────────────────────────────────────
  metrics:
    # Scale up when average CPU across pods exceeds 70%
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # Scale up when average memory exceeds 80%
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  # ── Scaling behaviour ──────────────────────────────────────────────────────
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60        # Wait 60s of sustained load before adding pods
      policies:
        - type: Pods
          value: 2                           # Add at most 2 pods per scaling event
          periodSeconds: 60
        - type: Percent
          value: 50                          # Or 50% of current replicas, whichever is larger
          periodSeconds: 60
      selectPolicy: Max

    scaleDown:
      stabilizationWindowSeconds: 300       # Cool down for 5 minutes before removing pods
      policies:
        - type: Pods
          value: 1                           # Remove at most 1 pod per scaling event
          periodSeconds: 120
      selectPolicy: Min
