# ═══════════════════════════════════════════════════════════════════════════
# KARTSEEK — Microservice Deployments + Services (GENERATED — do not edit by hand)
# Source: k8s/gen-microservices.sh   |   ports from each service's main.ts
# Covers the 22 services missing from microservices.yaml (auth/order/payment).
# Per-service differences belong in the case blocks of the generator.
# ═══════════════════════════════════════════════════════════════════════════
---
apiVersion: v1
kind: Service
metadata:
  name: admin-service
  namespace: kartseek
  labels: { app: admin-service, tier: microservice }
spec:
  type: ClusterIP
  selector: { app: admin-service }
  ports:
    - { name: http, port: 3027, targetPort: 3027, protocol: TCP }
    - { name: tcp, port: 4017, targetPort: 4017, protocol: TCP }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: kartseek
  labels: { app: admin-service, tier: microservice, version: "2.0.0" }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app: admin-service } }
  template:
    metadata:
      labels: { app: admin-service, tier: microservice, version: "2.0.0" }
    spec:
      serviceAccountName: microservice
      imagePullSecrets: [{ name: regcred }]
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      initContainers:
        # resources are mandatory — the namespace ResourceQuota's admission check
        # walks init containers and rejects the pod when they are unset.
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh','-c','until nc -z postgres.kartseek.svc.cluster.local 5432; do echo waiting for db; sleep 2; done']
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "50m", memory: "64Mi" }
      containers:
        - name: admin-service
          image: kartseek/admin-service:2.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: kartseek-config }
            - secretRef: { name: kartseek-secrets }
          ports:
            - { name: http, containerPort: 3027, protocol: TCP }
            - { name: tcp, containerPort: 4017, protocol: TCP }
          livenessProbe:
            tcpSocket: { port: 3027 }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket: { port: 3027 }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities: { drop: [ALL] }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: { matchExpressions: [{ key: app, operator: In, values: [admin-service] }] }
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
---
