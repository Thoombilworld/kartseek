apiVersion: v1
kind: Service
metadata:
  name: pharmacy-frontend
  namespace: kartseek
  labels:
    app: pharmacy-frontend
    tier: web
spec:
  type: ClusterIP
  selector:
    app: pharmacy-frontend
  ports:
    - name: http
      protocol: TCP
      port: 3005
      targetPort: 3005
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmacy-frontend
  namespace: kartseek
  labels:
    app: pharmacy-frontend
    tier: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pharmacy-frontend
  template:
    metadata:
      labels:
        app: pharmacy-frontend
        tier: web
    spec:
      imagePullSecrets:
        - name: regcred
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: pharmacy-frontend
          image: kartseek/pharmacy-frontend:${KARTSEEK_TAG}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: kartseek-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: API_URL
              value: 'http://api-gateway.kartseek.svc.cluster.local:3001/api/v1'
            - name: API_GATEWAY_ORIGIN
              value: 'http://api-gateway.kartseek.svc.cluster.local:3001'
          ports:
            - name: http
              containerPort: 3005
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /pharmacy/
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /pharmacy/
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /pharmacy/
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            requests:
              cpu: '100m'
              memory: '256Mi'
            limits:
              cpu: '500m'
              memory: '1Gi'
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - pharmacy-frontend
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
---
