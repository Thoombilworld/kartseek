              valueFrom:
                configMapKeyRef:
                  name: kartseek-config
                  key: PHARMACY_DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: kartseek-config
                  key: PHARMACY_DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: kartseek-config
                  key: PHARMACY_DB_NAME
            - name: DB_USER
              value: 'pharmacy_user'
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kartseek-secrets
                  key: PHARMACY_DB_PASSWORD
          ports:
            - name: http
              containerPort: 3020
              protocol: TCP
            - name: tcp
              containerPort: 4010
              protocol: TCP
          # This service binds its HTTP listener to 127.0.0.1 (see LOOPBACK_HTTP in
          # scripts/registry/k8s.mjs), which the kubelet cannot reach — so all three
          # probes fall back to the TCP transport, which does bind 0.0.0.0. A port
          # being open is a weaker claim than /health/ready; it is what is available.
          livenessProbe:
            tcpSocket:
              port: 4010
