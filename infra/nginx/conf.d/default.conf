# ─────────────────────────────────────────────────────────────────────────────
# KARTSEEK — HTTP/2 Server Blocks
# ─────────────────────────────────────────────────────────────────────────────

# ── HTTP → HTTPS Redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name  localhost kartseek.local *.kartseek.com;

    # Health check endpoint (plaintext for Docker/LB)
    location /nginx-health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS + HTTP/2 Server ───────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name  localhost kartseek.local *.kartseek.com;

    # ── SSL/TLS Configuration ────────────────────────────────────────────────
    ssl_certificate      /etc/nginx/ssl/kartseek.crt;
    ssl_certificate_key  /etc/nginx/ssl/kartseek.key;

    # TLS 1.2+ only (no TLS 1.0/1.1)
    ssl_protocols TLSv1.2 TLSv1.3;

    # Modern cipher suite — prioritize AEAD ciphers for HTTP/2 compatibility
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;

    # OCSP Stapling (improves TLS handshake performance)
    # Uncomment when using a real CA certificate:
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/nginx/ssl/ca-chain.pem;
    # resolver 8.8.8.8 8.8.4.4 valid=300s;

    # SSL Session Caching (reduces TLS handshake overhead)
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;
    ssl_session_tickets  off;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self), payment=(self)" always;

    # ── Client Body Limits ───────────────────────────────────────────────────
    client_max_body_size    50m;
    client_body_buffer_size 16k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # ── Proxy Defaults ───────────────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   X-Forwarded-Port  $server_port;
    proxy_set_header   X-Request-ID      $request_id;
    proxy_set_header   Connection        "";

    # Proxy buffering for performance
    proxy_buffering        on;
    proxy_buffer_size      16k;
    proxy_buffers          8 32k;
    proxy_busy_buffers_size 64k;

    # Proxy timeouts
    proxy_connect_timeout  10s;
    proxy_send_timeout     60s;
    proxy_read_timeout     60s;

    # ─────────────────────────────────────────────────────────────────────────
    # API Gateway (NestJS on port 3001)
    # ─────────────────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        limit_conn conn_zone 50;

        proxy_pass http://api_backend;

        # Disable buffering for streaming/SSE endpoints
        proxy_buffering off;

        # Cache API responses (short TTL for dynamic data)
        add_header X-Proxy-Cache $upstream_cache_status;
    }

    # Swagger docs passthrough
    location /docs {
        proxy_pass http://api_backend;
    }

    # GraphQL endpoint
    location /graphql {
        proxy_pass http://api_backend;
        proxy_read_timeout 120s;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # WebSocket Upgrade (Socket.IO / real-time)
    # ─────────────────────────────────────────────────────────────────────────
    # The seven server-level headers are REPEATED in the two blocks below.
    # `proxy_set_header` is inherited only while the current level declares none
    # of its own — it replaces, it does not merge — so a block that sets
    # `Upgrade` and nothing else was sending the gateway no X-Forwarded-For, no
    # X-Real-IP, no X-Request-ID and `Host: $proxy_host`. ws-ddos.guard.ts reads
    # x-forwarded-for to identify a socket and falls back to the peer address,
    # which through a proxy is the proxy: one shared connection cap and one ban
    # for every client behind it.
    #
    # Sending the header is only half of it: the guard believes it only from a
    # peer in DDOS_TRUSTED_PROXIES, which it used to match as exact strings
    # against `127.0.0.1,::1`. This config is the HOST one — nginx on the
    # developer's machine, proxying to 127.0.0.1 — so the default happens to fit
    # here; it did not in compose, where the edge is a container on
    # kartseek-network, and the single bucket survived the header fix
    # (whole-branch review N1). Membership is by CIDR now
    # (libs/security/src/trusted-proxies.util.ts).
    location /socket.io/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Next.js Web Application (port 3000)
    # ─────────────────────────────────────────────────────────────────────────
    location / {
        limit_req zone=web_zone burst=40 nodelay;

        proxy_pass http://web_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Request-ID      $request_id;
        # Next.js Hot Module Replacement (dev only)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # Next.js static assets — aggressive caching
    location /_next/static/ {
        proxy_pass http://web_backend;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Next.js image optimization
    location /_next/image {
        proxy_pass http://web_backend;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Health Check
    # ─────────────────────────────────────────────────────────────────────────
    location /nginx-health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Error Pages
    # ─────────────────────────────────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
