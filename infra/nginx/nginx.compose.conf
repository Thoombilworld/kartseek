# ─────────────────────────────────────────────────────────────────────────────
# KARTSEEK — NGINX for the CONTAINERISED application tier
# ─────────────────────────────────────────────────────────────────────────────
#
# The sibling `nginx.conf` is the DEFAULT and upstreams `host.docker.internal`
# — the developer's own `npm run dev` fleet on the host. This file is its
# counterpart for `--profile admin` / `--profile full`, where the app tier runs
# as containers on `kartseek-network` and every deployable answers to its
# compose service name.
#
#   NGINX_CONF=nginx.compose.conf docker compose up -d nginx
#
# `compose.infra.yml` mounts `../nginx/${NGINX_CONF:-nginx.conf}` onto
# /etc/nginx/nginx.conf, so the variable selects between the two and `npm run
# dev` is unaffected by this file's existence. See infra/docker/README.md,
# "Which nginx config is mounted".
#
# ── Two things here are deliberately NOT copies of nginx.conf ────────────────
#
# 1. IT DOES NOT `include /etc/nginx/conf.d/*.conf`. That directory is still
#    mounted (read-only) and holds `default.conf`, whose server blocks are the
#    host-process ones: they proxy to the `api_backend` / `web_backend`
#    upstreams defined in nginx.conf and, on port 80, 301 everything to HTTPS.
#    Including them here would put the host fleet back in the path. Every route
#    this file serves is therefore written out below, in one server block.
#
# 2. IT RESOLVES UPSTREAMS AT REQUEST TIME, through a variable, rather than
#    with `upstream { server … }`. nginx resolves the names in an `upstream`
#    block once, at startup, and EXITS if one does not resolve — "host not
#    found in upstream". The `admin` profile has no zone containers at all
#    (twelve deployables, no `*-frontend` but the console), so a static upstream
#    naming `marketplace-frontend` would take the whole edge down whenever the
#    smaller profile is up, including the /api/ and / routes that do work. With
#    `set $x "name:port"` + `proxy_pass http://$x` and Docker's embedded DNS as
#    the resolver, an absent service is a 502 on its own path and nothing else.
#
# Port 80 serves the application here; it does NOT redirect to HTTPS the way
# `conf.d/default.conf` does. The console's client bundle is built with
# `COMPOSE_API_URL` (default `http://nginx/api/v1`) inlined into it, so the
# API calls it makes are plain http against this edge — a 301 to a self-signed
# https origin fails every one of them, in the browser, with nothing in the
# gateway log. 443 is still served, from the same block and the same
# certificate as the host config, for anyone who wants it.
# ─────────────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    # `upstream_addr` is added to the host config's format on purpose: it is the
    # line that proves a request reached the CONTAINER (172.x, the address
    # `api-gateway` resolves to) rather than the host fleet.
    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time uct=$upstream_connect_time '
                      'uht=$upstream_header_time urt=$upstream_response_time '
                      'up=$upstream_addr h2=$http2';

    access_log  /var/log/nginx/access.log  main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens   off;

    # ── Gzip Compression ─────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/plain
        text/javascript
        text/xml;

    # ── Rate Limiting Zones ──────────────────────────────────────────────────
    # The same zones and rates as the host config, so a rate limit is never the
    # difference between the two paths when a validation run disagrees.
    limit_req_zone  $binary_remote_addr  zone=api_zone:10m   rate=30r/s;
    limit_req_zone  $binary_remote_addr  zone=web_zone:10m   rate=50r/s;
    limit_conn_zone $binary_remote_addr  zone=conn_zone:10m;

    # ── WebSocket upgrade ────────────────────────────────────────────────────
    # `Connection: upgrade` only when the client actually asked for it. The host
    # config sets it unconditionally on `/` for Next's HMR; these containers run
    # a production server, which has none, and sending the header on ordinary
    # requests confuses keep-alive for no gain.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Docker's embedded DNS ────────────────────────────────────────────────
    # Required by the variable `proxy_pass` below — see the header. 127.0.0.11
    # is the resolver every container on a user-defined network gets; `valid`
    # keeps a restarted container's new address from being cached for long.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80;
        listen [::]:80;
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        server_name  localhost kartseek.local *.kartseek.com;

        # ── SSL/TLS ──────────────────────────────────────────────────────────
        # The same self-signed pair the host config uses (infra/nginx/ssl,
        # mounted read-only). Plain http on port 80 above is the path the
        # containerised console is built for; this is here so 443 does not
        # simply refuse the connection.
        ssl_certificate      /etc/nginx/ssl/kartseek.crt;
        ssl_certificate_key  /etc/nginx/ssl/kartseek.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  1d;
        ssl_session_tickets  off;

        # ── Security Headers ─────────────────────────────────────────────────
        # No HSTS. The host config sends it from conf.d/default.conf; on
        # `localhost` an HSTS entry is sticky for a year and applies to every
        # port, which would make the developer's own http://localhost:3000 fleet
        # unreachable long after these containers are gone. apps/web's
        # next.config.mjs refuses to send it for the same reason.
        add_header X-Frame-Options          "SAMEORIGIN" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-XSS-Protection         "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self), payment=(self)" always;

        # ── Client Body Limits ───────────────────────────────────────────────
        client_max_body_size    50m;
        client_body_buffer_size 16k;
        client_header_buffer_size 4k;
        large_client_header_buffers 4 16k;

        # ── Proxy Defaults ───────────────────────────────────────────────────
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_set_header   Connection        "";

        proxy_buffering        on;
        proxy_buffer_size      16k;
        proxy_buffers          8 32k;
        proxy_busy_buffers_size 64k;

        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;

        # The upstreams, by compose service name and the port services.yaml
        # gives each one. `set` rather than `upstream` — see the header.
        set $api_gateway  "api-gateway:3001";
        set $web_shell    "web:3000";

        # ─────────────────────────────────────────────────────────────────────
        # API Gateway — kartseek-api-gateway, 3001
        # ─────────────────────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_zone burst=20 nodelay;
            limit_conn conn_zone 50;
            # Streaming and SSE endpoints: buffering holds the whole response.
            proxy_buffering off;
            proxy_pass http://$api_gateway;
        }

        # Swagger docs passthrough.
        location /docs {
            proxy_pass http://$api_gateway;
        }

        # GraphQL.
        location /graphql {
            proxy_read_timeout 120s;
            proxy_pass http://$api_gateway;
        }

        # Socket.IO / real-time. This is the path `COMPOSE_WS_URL` (default
        # `ws://nginx`) resolves against: the client appends /socket.io/ itself.
        location /socket.io/ {
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
            proxy_pass http://$api_gateway;
        }

        # ─────────────────────────────────────────────────────────────────────
        # The eight zones — each its own Next container, under its own basePath
        # ─────────────────────────────────────────────────────────────────────
        #
        # Straight to the zone container, NOT through the console's rewrites.
        # apps/web rewrites /marketplace/* to MARKETPLACE_ZONE_ORIGIN, but Next
        # evaluates `rewrites()` during `next build` and freezes the resolved
        # destination into .next/routes-manifest.json — so in a standalone image
        # that destination is whatever it was AT BUILD TIME (`http://localhost:3002`
        # by default, which inside the console container is the console itself),
        # and the runtime `*_ZONE_ORIGIN` the generator emits cannot move it.
        # Routing each base path here is what makes a zone reachable at all
        # through this edge; the pair of locations per zone mirrors the pair of
        # rewrite rules (the bare path, and everything under it — including the
        # zone's own /_next/* assets, which it emits under its assetPrefix).
        #
        # A zone that is not running (the `admin` profile has none) answers 502
        # here and affects nothing else.
        set $marketplace_zone "marketplace-frontend:3002";
        location = /marketplace     { proxy_pass http://$marketplace_zone; }
        location   /marketplace/    { proxy_pass http://$marketplace_zone; }

        set $grocery_zone "grocery-frontend:3003";
        location = /grocery         { proxy_pass http://$grocery_zone; }
        location   /grocery/        { proxy_pass http://$grocery_zone; }

        set $restaurant_zone "restaurant-frontend:3004";
        location = /restaurant      { proxy_pass http://$restaurant_zone; }
        location   /restaurant/     { proxy_pass http://$restaurant_zone; }

        set $pharmacy_zone "pharmacy-frontend:3005";
        location = /pharmacy        { proxy_pass http://$pharmacy_zone; }
        location   /pharmacy/       { proxy_pass http://$pharmacy_zone; }

        set $doctor_zone "doctor-frontend:3006";
        location = /doctor          { proxy_pass http://$doctor_zone; }
        location   /doctor/         { proxy_pass http://$doctor_zone; }

        # hotel-booking, not hotel: the base path and the service name differ.
        set $hotel_zone "hotel-frontend:3007";
        location = /hotel-booking   { proxy_pass http://$hotel_zone; }
        location   /hotel-booking/  { proxy_pass http://$hotel_zone; }

        set $taxi_zone "taxi-frontend:3008";
        location = /taxi            { proxy_pass http://$taxi_zone; }
        location   /taxi/           { proxy_pass http://$taxi_zone; }

        set $franchise_zone "franchise-frontend:3009";
        location = /franchise       { proxy_pass http://$franchise_zone; }
        location   /franchise/      { proxy_pass http://$franchise_zone; }

        # ─────────────────────────────────────────────────────────────────────
        # The console — kartseek-web, 3000. Everything not claimed above.
        # ─────────────────────────────────────────────────────────────────────
        location / {
            limit_req zone=web_zone burst=40 nodelay;
            proxy_pass http://$web_shell;
        }

        # The console's own static assets. A zone's live under its base path and
        # are matched by the zone locations above, not here.
        location /_next/static/ {
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
            proxy_pass http://$web_shell;
        }

        location /_next/image {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            proxy_pass http://$web_shell;
        }

        # ── Health ───────────────────────────────────────────────────────────
        # compose.infra.yml's HEALTHCHECK probes exactly this, over plain http
        # on port 80 — so it has to be here and it has to answer without a
        # redirect, or the nginx container is unhealthy for as long as this file
        # is the mounted one.
        location /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'OK';
        }

        # ── Error Pages ──────────────────────────────────────────────────────
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
