# ══════════════════════════════════════════════════════════════════════════════
# KARTSEEK Microservices Deployment (Auth, Order, Payment)
# Deploy: kubectl apply -f k8s/microservices.yaml
# ══════════════════════════════════════════════════════════════════════════════

---
# ── Service: Auth Service ──────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: kartseek
  labels:
    app: auth-service
    tier: microservice
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - name: http
      protocol: TCP
      port: 3010
      targetPort: 3010
    - name: grpc
      protocol: TCP
      port: 5001
      targetPort: 5001

---
# ── Deployment: Auth Service ──────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: kartseek
  labels:
    app: auth-service
    tier: microservice
    version: "2.0.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        tier: microservice
        version: "2.0.0"
    spec:
      serviceAccountName: microservice
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      imagePullSecrets:
        - name: regcred

      initContainers:
        # resources are required: the namespace ResourceQuota's admission check
        # covers init containers, and rejects the pod if they are unset.
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres.kartseek.svc.cluster.local 5432; do echo waiting for db; sleep 2; done']
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "50m", memory: "64Mi" }

      containers:
        - name: auth-service
          image: kartseek/auth-service:2.0.0
          imagePullPolicy: IfNotPresent

          # Same ConfigMap + Secret as every other service (see the note in
          # api-gateway.yaml): one source of truth for the port map beats a
          # per-service list that drifts.
          envFrom:
            - configMapRef:
                name: kartseek-config
            - secretRef:
                name: kartseek-secrets

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          ports:
            - name: http
              containerPort: 3010
              protocol: TCP
            - name: grpc
              containerPort: 5001
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - auth-service
                topologyKey: kubernetes.io/hostname

      terminationGracePeriodSeconds: 30

---
# ── Service: Order Service ─────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: kartseek
  labels:
    app: order-service
    tier: microservice
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      protocol: TCP
      port: 3014
      targetPort: 3014
    - name: grpc
      protocol: TCP
      port: 5002
      targetPort: 5002
    # order-service binds a third listener — the Nest TCP transport on 4004 —
    # and it is the one that matters most: checkout's `place_order` command is a
    # request/response call the gateway makes over this port, not over gRPC or
    # Kafka. It was missing from both the Service and the pod spec, so every
    # checkout in the cluster failed to connect.
    - name: tcp
      protocol: TCP
      port: 4004
      targetPort: 4004

---
