---
# ── Service: Payment Service ───────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: kartseek
  labels:
    app: payment-service
    tier: microservice
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    # 3025, not 3015 — payment-service's own main.ts binds
    # `PAYMENT_SERVICE_PORT ?? 3025`. 3015 is loyalty-service's HTTP port; the
    # ConfigMap key had been set to it, which pointed the probe at a listener
    # that was never going to exist.
    - name: http
      protocol: TCP
      port: 3025
      targetPort: 3025
    - name: grpc
      protocol: TCP
      port: 5003
      targetPort: 5003
    - name: tcp
      protocol: TCP
      port: 4026
      targetPort: 4026

---
