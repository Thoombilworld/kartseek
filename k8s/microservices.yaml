    tier: microservice
    version: "2.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        tier: microservice
        version: "2.0.0"
    spec:
      serviceAccountName: microservice
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      imagePullSecrets:
        - name: regcred

      initContainers:
        # resources are required: the namespace ResourceQuota's admission check
        # covers init containers, and rejects the pod if they are unset.
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres.kartseek.svc.cluster.local 5432; do echo waiting for db; sleep 2; done']
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "50m", memory: "64Mi" }

      containers:
        - name: order-service
          image: kartseek/order-service:2.0.0
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: kartseek-config
            - secretRef:
                name: kartseek-secrets

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          ports:
            - name: http
              containerPort: 3014
              protocol: TCP
            - name: grpc
              containerPort: 5002
              protocol: TCP
            - name: tcp
              containerPort: 4004
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
