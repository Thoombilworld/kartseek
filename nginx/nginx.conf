# ─────────────────────────────────────────────────────────────────────────────
# KARTSEEK — NGINX Reverse Proxy with HTTP/2
# ─────────────────────────────────────────────────────────────────────────────
# This config enables HTTP/2 for all client connections while proxying
# to the NestJS API Gateway (port 3001) and Next.js Web App (port 3000)
# via HTTP/1.1 upstream connections.
#
# HTTP/2 Benefits:
#   • Multiplexed requests over a single TCP connection
#   • Header compression (HPACK)
#   • Server push capabilities
#   • Binary framing (faster parsing)
#   • Stream prioritization
# ─────────────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time uct=$upstream_connect_time '
                      'uht=$upstream_header_time urt=$upstream_response_time '
                      'h2=$http2';

    access_log  /var/log/nginx/access.log  main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens   off;

    # ── Gzip Compression ─────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/plain
        text/javascript
        text/xml;

    # ── Rate Limiting Zones ──────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr  zone=api_zone:10m   rate=30r/s;
    limit_req_zone  $binary_remote_addr  zone=web_zone:10m   rate=50r/s;
    limit_conn_zone $binary_remote_addr  zone=conn_zone:10m;

    # ── Upstream Definitions ─────────────────────────────────────────────────
    upstream api_backend {
        least_conn;
        server host.docker.internal:3001  max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream web_backend {
        least_conn;
        server host.docker.internal:3000  max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ── Include server blocks ────────────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
