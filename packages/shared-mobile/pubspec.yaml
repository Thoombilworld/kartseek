name: kartseek_shared_mobile
description: "KARTSEEK shared mobile code — core infrastructure, auth, and common features used by both Customer and Partner apps."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  bloc: ^9.0.0
  bloc_concurrency: ^0.3.0
  equatable: ^2.0.7
  dio: ^5.7.0
  socket_io_client: ^3.1.6
  intl: ^0.20.2
  google_fonts: ^8.1.0
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^10.3.1
  geolocator: any
  local_auth: ^3.0.1
  google_maps_flutter: ^2.10.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.1.1
  camera: ^0.12.0+1
  path_provider: ^2.1.6
  speech_to_text: ^7.0.0
  image_picker: ^1.1.2
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# ─── Dependency Overrides ───────────────────────────────────────────────
dependency_overrides:
  objective_c:
    path: ../../packages/vendor/objective_c
  flutter_plugin_android_lifecycle: 2.0.35
