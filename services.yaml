    env: { http: DELIVERY_SERVICE_PORT, grpc: DELIVERY_GRPC_PORT }
    health: { live: /health, ready: /health/ready }
    # Same as commission-service: the `delivery` schema is empty and
    # `delivery-service.module.ts` registers no DataSource — `delivery.module.ts`
    # is dead code.
    database: null
    # postgres dropped with the `database` entry above: this service opens no
    # connection, so listing it would keep compose and the k8s manifests waiting
    # on a store it never speaks to.
    dependsOn: [redis, kafka]

